{% extends 'base.html' %}

{% block titulo %}
Profesiones
{% endblock %}


{% block contenido %}
<header class="page-header page-header-dark bg-gradient-primary-to-secondary pb-10">
  <div class="container-xl px-4">
    <div class="page-header-content pt-4">
      <div class="row align-items-center justify-content-between">
        <div class="col-auto mt-4">
          <h1 class="page-header-title">Gestión de Profesiones
          </h1>
          <div class="page-header-subtitle">Administración de ocupaciones y profesiones para el registro de pacientes y
            personal</div>
        </div>
      </div>
    </div>
  </div>
</header>

<div class="container-xl px-4 mt-n10">
  <div class="card card-header-actions mb-4">
    <div class="card-header">
      Listado de Profesiones
      <button class="btn btn-sm btn-{{ ui.boton_agregar }} shadow-sm" type="button" id="btnAgregar">
        <i class="fas fa-plus fa-sm text-white-50 me-1"></i> Agregar Profesión
      </button>
    </div>
    <div class="card-body">
      <div class="table-responsive">
        <table class="table table-hover table-bordered align-middle w-100" id="tbl">
          <thead class="table-light">
            <tr>
              <th>Descripción</th>
              <th>Estado</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- Modal formulario -->
<div class="modal fade" id="modalFormulario" tabindex="-1" role="dialog" aria-labelledby="modalTitle"
  aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered" role="document">
    <div class="modal-content border-0 shadow">
      <div class="modal-header border-bottom">
        <h5 class="modal-title fw-bold" id="modalTitle"></h5>
        <button class="btn-close" type="button" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body p-4">
        <form id="formProfesion">
          <input type="hidden" id="txtIdProfesion">
          <div class="mb-3">
            <label class="small mb-1" for="txtDescripcion">Descripción <span class="text-danger">*</span></label>
            <input class="form-control" id="txtDescripcion" type="text" placeholder="Ingrese la profesión/ocupación"
              required>
          </div>
          <div class="mb-3">
            <label class="fw-semibold small mb-1" for="selEstado">Estado <span class="text-danger">*</span></label>
            <select class="form-select" id="selEstado" required>
              <option value="A">Activo</option>
              <option value="I">Inactivo</option>
            </select>
          </div>
        </form>
      </div>
      <div class="modal-footer bg-light border-top">
        <button class="btn btn-{{ ui.boton_limpiar }}" type="button" data-bs-dismiss="modal">Cerrar</button>
        <button class="btn btn-{{ ui.boton_guardar }}" type="button" id="btnGuardar">Guardar Cambios</button>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block js %}
<script>
  const CSRFToken = "{{ csrf_token() }}" || null;

  const initDatatable = () => {
    $('#tbl').DataTable({
      language: {
        url: "{{ url_for('static', filename='vendor/datatables/es-ES.json') }}",
      },
      ajax: '/api/v1/profesiones',
      columns: [
        { data: 'descripcion' },
        {
          data: 'estado', render: function (val) {
            return val ? '<span class="badge bg-{{ ui.color_badge_activo }}-soft text-{{ ui.color_badge_activo }}">Activo</span>'
              : '<span class="badge bg-{{ ui.color_badge_inactivo }}-soft text-{{ ui.color_badge_inactivo }}">Inactivo</span>';
          }
        },
        {
          data: function (row) {
            return `<button class="btn btn-datatable btn-icon btn-transparent-dark me-2" type="button" name="btn_editar" data-id="${row.id}"><i class="fas fa-edit"></i></button>
                    <button class="btn btn-datatable btn-icon btn-transparent-dark me-2" type="button" name="btn_eliminar" data-id="${row.id}"><i class="fas fa-trash-alt"></i></button>`
          }
        }
      ]
    });
  }

  const agregar = () => {
    $('#btnAgregar').on('click', function () {
      $('#modalTitle').text("Agregar una Profesión");
      $('#txtIdProfesion').val("");
      $('#txtDescripcion').val("");
      $('#chkEstado').prop("checked", true);
      new bootstrap.Modal(document.getElementById('modalFormulario')).show();
    });
  }

  const guardar = () => {
    $('#btnGuardar').on('click', function () {
      const idProfesion = $('#txtIdProfesion').val();
      const nuevaDescripcion = $('#txtDescripcion').val();
      const estado = $('#chkEstado').is(':checked');
      const tabla = $('#tbl').DataTable();

      const payload = { descripcion: nuevaDescripcion, estado: estado };

      if (idProfesion) {
        // update
        fetch(`/api/v1/profesiones/${idProfesion}`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': CSRFToken
          },
          body: JSON.stringify(payload)
        })
          .then(resp => resp.json())
          .then(data => {
            if (data && !data.error && data.success) {
              tabla.ajax.reload();
              Swal.fire("Actualizado", "La profesión ha sido actualizada correctamente.", "success");
              (bootstrap.Modal.getInstance(document.getElementById("modalFormulario")) || new bootstrap.Modal(document.getElementById("modalFormulario"))).hide();
            } else {
              Swal.fire("Error", data.error || "No se pudo actualizar la profesión.", "error");
            }
          }).catch(err => {
            console.error(err);
            Swal.fire("Error", "Ocurrió un error al actualizar la profesión.", "error");
          });
      } else {
        // insert
        fetch(`/api/v1/profesiones`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': CSRFToken
          },
          body: JSON.stringify(payload)
        })
          .then(resp => resp.json())
          .then(data => {
            if (data && !data.error && data.success) {
              tabla.ajax.reload();
              Swal.fire("Agregado", "La profesión ha sido agregada correctamente.", "success");
              (bootstrap.Modal.getInstance(document.getElementById("modalFormulario")) || new bootstrap.Modal(document.getElementById("modalFormulario"))).hide();
            } else {
              Swal.fire("Error", data.error || "No se pudo guardar la profesión.", "error");
            }
          }).catch(err => {
            console.error(err);
            Swal.fire("Error", "Ocurrió un error al guardar la profesión.", "error");
          });
      }
    });
  }

  const editar = () => {
    $('#tbl').on('click', 'button[name="btn_editar"]', function () {
      Swal.fire({
        title: "¿Deseas editar este registro?",
        showCancelButton: true,
        confirmButtonText: "Si",
        cancelButtonText: `No`
      }).then((result) => {
        if (result.isConfirmed) {
          $('#modalTitle').text("Editar una Profesión");

          const idProfesion = $(this).data('id');
          $('#txtIdProfesion').val(idProfesion);

          fetch(`/api/v1/profesiones/${idProfesion}`, {
            method: 'GET',
            headers: { 'Content-Type': 'application/json' }
          })
            .then(resp => resp.json())
            .then(data => {
              $('#txtDescripcion').val(data.data.descripcion);
              $('#chkEstado').prop("checked", data.data.estado);
              new bootstrap.Modal(document.getElementById('modalFormulario')).show();
            });
        }
      });
    });
  }

  const eliminar = () => {
    $('#tbl').on('click', 'button[name="btn_eliminar"]', function () {
      const idProfesion = $(this).data('id');
      Swal.fire({
        title: "¿Deseas eliminar este registro?",
        showCancelButton: true,
        confirmButtonText: "Si",
        cancelButtonText: `No`
      }).then((result) => {
        if (result.isConfirmed) {
          fetch(`/api/v1/profesiones/${idProfesion}`, {
            method: 'DELETE',
            headers: {
              'Content-Type': 'application/json',
              'X-CSRFToken': CSRFToken
            }
          })
            .then(resp => resp.json())
            .then(data => {
              if (data && !data.error && data.success) {
                const fila = $(this).closest('tr');
                const tabla = $('#tbl').DataTable();
                tabla.row(fila).remove().draw();
                Swal.fire("Eliminado", "La profesión ha sido eliminada.", "success");
              } else {
                Swal.fire("Error", data.error || "No se pudo eliminar la profesión.", "error");
              }
            }).catch(err => {
              Swal.fire("Error", "Ocurrió un error al eliminar la profesión.", "error");
            });
        }
      });
    });
  }

  const addEvents = () => {
    agregar();
    guardar();
    editar();
    eliminar();
  }

  $(function () {
    initDatatable();
    addEvents();
  });
</script>
{% endblock %}
