{% extends 'base.html' %}

{% block titulo %}
Ciudades
{% endblock %}


{% block contenido %}
<header class="page-header page-header-dark bg-gradient-primary-to-secondary pb-10">
  <div class="container-xl px-4">
    <div class="page-header-content pt-4">
      <div class="row align-items-center justify-content-between">
        <div class="col-auto mt-4">
          <h1 class="page-header-title">Gestión de Ciudades</h1>
          <div class="page-header-subtitle">Listado y administración de ciudades del sistema</div>
        </div>
      </div>
    </div>
  </div>
</header>

<div class="container-xl px-4 mt-n10">
    <div class="card card-header-actions mb-4 shadow-sm">
    <div class="card-header">
      <span class="fw-semibold">Listado de Ciudades</span>
      <button class="btn btn-sm btn-{{ ui.boton_agregar }} shadow-sm" type="button" id="btnAgregar">
        <i class="fas fa-plus fa-sm me-1"></i> Agregar Ciudad
      </button>
    </div>
    <div class="card-body">
      <div class="table-responsive">
        <table class="table table-hover table-bordered align-middle w-100" id="tbl">
          <thead class="table-light">
            <tr>
              <th>Descripción</th>
              <th class="text-center" style="width: 110px;">Estado</th>
              <th class="text-center" style="width: 100px;">Acciones</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- Modal formulario -->
<div class="modal fade" id="modalFormulario" tabindex="-1" role="dialog" aria-labelledby="modalTitle" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered" role="document">
    <div class="modal-content border-0 shadow">
      <div class="modal-header border-bottom">
        <h5 class="modal-title fw-bold" id="modalTitle">
          <span id="modalTitleText"></span>
        </h5>
        <button class="btn-close" type="button" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body p-4">
        <form id="formCiudad" novalidate>
          <input type="hidden" id="txtIdCiudad">
          <div class="mb-3">
            <label class="small mb-1 fw-semibold" for="txtDescripcion">
              Descripción <span class="text-danger">*</span>
            </label>
            <input class="form-control" id="txtDescripcion" type="text"
              placeholder="Ingrese nombre de la ciudad" required>
            <div class="invalid-feedback">Este campo es obligatorio.</div>
          </div>
          <div class="mb-3">
            <label class="fw-semibold small mb-1" for="selEstado">Estado <span class="text-danger">*</span></label>
            <select class="form-select" id="selEstado" required>
              <option value="A">Activo</option>
              <option value="I">Inactivo</option>
            </select>
          </div>
        </form>
      </div>
      <div class="modal-footer bg-light border-top">
        <button class="btn btn-{{ ui.boton_limpiar }} shadow-sm" type="button" data-bs-dismiss="modal">
          <i class="fas fa-times me-1"></i> Cerrar
        </button>
        <button class="btn btn-{{ ui.boton_guardar }} shadow-sm" type="button" id="btnGuardar">
          <i class="fas fa-save me-1"></i> Guardar Cambios
        </button>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block js %}
<script>
  const CSRFToken = "{{ csrf_token() }}" || null;

  const initDatatable = () => {
    $('#tbl').DataTable({
      language: {
        url: "{{ url_for('static', filename='vendor/datatables/es-ES.json') }}",
      },
      ajax: '/api/v1/ciudades',
      columns: [
        { data: 'descripcion' },
        {
          data: 'estado',
          className: 'text-center',
          render: function (val) {
            return val
              ? '<span class="badge bg-{{ ui.color_badge_activo }}-soft text-{{ ui.color_badge_activo }}">Activo</span>'
              : '<span class="badge bg-{{ ui.color_badge_inactivo }}-soft text-{{ ui.color_badge_inactivo }}">Inactivo</span>';
          }
        },
        {
          className: 'text-center',
          data: function (row) {
            return `<button class="btn btn-datatable btn-icon btn-transparent-dark me-1" type="button" name="btn_editar" data-id="${row.id}" title="Editar"><i class="fas fa-edit"></i></button>
                    <button class="btn btn-datatable btn-icon btn-transparent-dark text-danger" type="button" name="btn_eliminar" data-id="${row.id}" title="Eliminar"><i class="fas fa-trash-alt"></i></button>`
          }
        }
      ]
    });
  }

  const abrirModal = (titulo, idCiudad = '', descripcion = '', estado = 'A') => {
    $('#modalTitleText').text(titulo);
    $('#txtIdCiudad').val(idCiudad);
    $('#txtDescripcion').val(descripcion).removeClass('is-invalid');
    $('#selEstado').val(estado);
    new bootstrap.Modal(document.getElementById('modalFormulario')).show();
  }

  const agregar = () => {
    $('#btnAgregar').on('click', function () {
      abrirModal("Agregar Ciudad");
    });
  }

  const guardar = () => {
    $('#btnGuardar').on('click', function () {
      const idCiudad = $('#txtIdCiudad').val();
      const nuevaDescripcion = $('#txtDescripcion').val().trim();
      const tabla = $('#tbl').DataTable();

      if (!nuevaDescripcion) {
        $('#txtDescripcion').addClass('is-invalid');
        return;
      }
      $('#txtDescripcion').removeClass('is-invalid');

      const payload = { descripcion: nuevaDescripcion, estado: $('#selEstado').val() };
      const url = idCiudad ? `/api/v1/ciudades/${idCiudad}` : `/api/v1/ciudades`;
      const method = idCiudad ? 'PUT' : 'POST';
      const msgOk = idCiudad ? 'Ciudad actualizada correctamente.' : 'Ciudad agregada correctamente.';
      const tituloOk = idCiudad ? 'Actualizado' : 'Agregado';

      fetch(url, {
        method,
        headers: { 'Content-Type': 'application/json', 'X-CSRFToken': CSRFToken },
        body: JSON.stringify(payload)
      })
        .then(resp => resp.json())
        .then(data => {
          if (data && !data.error && data.success) {
            tabla.ajax.reload();
            Swal.fire(tituloOk, msgOk, "success");
            (bootstrap.Modal.getInstance(document.getElementById("modalFormulario"))).hide();
          } else {
            Swal.fire("Error", data.error || "No se pudo guardar.", "error");
          }
        }).catch(() => Swal.fire("Error", "Error de red.", "error"));
    });
  }

  const editar = () => {
    $('#tbl').on('click', 'button[name="btn_editar"]', function () {
      const idCiudad = $(this).data('id');
      Swal.fire({
        title: "¿Deseas editar este registro?",
        icon: 'question',
        showCancelButton: true,
        confirmButtonText: "Sí",
        cancelButtonText: "No"
      }).then((result) => {
        if (result.isConfirmed) {
          fetch(`/api/v1/ciudades/${idCiudad}`, { method: 'GET' })
            .then(resp => resp.json())
            .then(data => {
              abrirModal("Editar Ciudad", data.data.id, data.data.descripcion, data.data.estado ? 'A' : 'I');
            });
        }
      });
    });
  }

  const eliminar = () => {
    $('#tbl').on('click', 'button[name="btn_eliminar"]', function () {
      const idCiudad = $(this).data('id');
      const fila = $(this).closest('tr');
      Swal.fire({
        title: "¿Deseas eliminar este registro?",
        icon: 'warning',
        showCancelButton: true,
        confirmButtonText: "Sí, eliminar",
        cancelButtonText: "Cancelar",
        confirmButtonColor: '#e74a3b'
      }).then((result) => {
        if (result.isConfirmed) {
          fetch(`/api/v1/ciudades/${idCiudad}`, {
            method: 'DELETE',
            headers: { 'Content-Type': 'application/json', 'X-CSRFToken': CSRFToken }
          })
            .then(resp => resp.json())
            .then(data => {
              if (data && !data.error && data.success) {
                const tabla = $('#tbl').DataTable();
                tabla.row(fila).remove().draw();
                Swal.fire("Eliminado", "La ciudad ha sido eliminada.", "success");
              } else {
                Swal.fire("Error", data.error || "No se pudo eliminar.", "error");
              }
            }).catch(() => Swal.fire("Error", "Error de red.", "error"));
        }
      });
    });
  }

  $(function () {
    initDatatable();
    agregar();
    guardar();
    editar();
    eliminar();
  });
</script>
{% endblock %}
