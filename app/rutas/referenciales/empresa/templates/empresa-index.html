{% extends 'base.html' %}
    
{% block titulo %}
Empresa
{% endblock %}

{% block contenido %}
<div class="container-fluid mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="mb-0">
            <i class="fas fa-building"></i> Gestión de Empresa
        </h3>
        <a href="{{ url_for('empresa.empresaAgregar') }}" class="btn btn-primary">
            <i class="fas fa-plus"></i> Nueva Empresa
        </a>
    </div>

    <!-- Tarjeta principal -->
    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h5 class="mb-0">Lista de Empresas</h5>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-striped table-hover table-bordered w-100" id="tbl">
                    <thead class="thead-dark">
                        <tr>
                            <th>RUC</th>
                            <th>Razón Social</th>
                            <th>Nombre Comercial</th>
                            <th>Ciudad</th>
                            <th>Estado</th>
                            <th>Principal</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block js %}
<script>
  const CSRFToken = "{{ csrf_token() }}" || null;

  const initDatatable = () => {
    $('#tbl').DataTable({
      language: {
        url: "{{ url_for('static', filename='vendor/datatables/es-ES.json') }}",
      },
      ajax: '/api/v1/empresas',
      columns: [
        { data: 'ruc_nit' },
        { data: 'razon_social' },
        { data: 'nombre_comercial' },
        { data: 'ciudad' },
        { 
          data: 'estado', 
          render: function(val) {
            return val ? '<span class="badge badge-success">Activo</span>'
                       : '<span class="badge badge-secondary">Inactivo</span>';
          }
        },
        {
          data: 'es_principal',
          render: function(val) {
            return val ? '<span class="badge badge-primary">Principal</span>' : '';
          }
        },
        { 
          data: function(row) {
            return `<button type="button" name="btn_editar" class="btn btn-primary btn-sm" data-id="${row.id}">
                      <i class="fas fa-edit"></i> Editar
                    </button>
                    <button type="button" name="btn_eliminar" class="btn btn-danger btn-sm" data-id="${row.id}">
                      <i class="fas fa-trash"></i> Eliminar
                    </button>`;
          }
        }
      ]
    });
  }

  const editar = () => {
    $('#tbl').on('click', 'button[name="btn_editar"]', function(){
      const idEmpresa = $(this).data('id');
      window.location.href = "{{ url_for('empresa.empresaAgregar') }}?id=" + idEmpresa;
    });
  }

  const eliminar = () => {
    $('#tbl').on('click', 'button[name="btn_eliminar"]', function(){
      const idEmpresa = $(this).data('id');
      
      Swal.fire({
        title: "¿Deseas eliminar este registro?",
        text: "Esta acción no se puede deshacer.",
        icon: "warning",
        showCancelButton: true,
        confirmButtonText: "Sí, eliminar",
        cancelButtonText: "Cancelar",
        confirmButtonColor: "#d33"
      }).then((result) => {
        if (result.isConfirmed) {
          fetch(`/api/v1/empresas/${idEmpresa}`, {
            method: 'DELETE',
            headers: {
              'Content-Type': 'application/json',
              'X-CSRFToken': CSRFToken
            }
          })
          .then(resp => resp.json())
          .then(data => {
            if(data && !data.error && data.success) {
              const tabla = $('#tbl').DataTable();
              tabla.ajax.reload();
              Swal.fire("Eliminado", "La empresa ha sido eliminada.", "success");
            } else {
              Swal.fire("Error", data.error || "No se pudo eliminar la empresa.", "error");
            }
          })
          .catch(err => {
            console.error(err);
            Swal.fire("Error", "Ocurrió un error al eliminar la empresa.", "error");
          });
        }
      });
    });
  }

  $(function() {
    initDatatable();
    editar();
    eliminar();
  });
</script>
{% endblock %}
