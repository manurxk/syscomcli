{% extends 'base.html' %}
    
{% block titulo %}
Condiciones de Venta
{% endblock %}

{% block contenido %}
<div class="container mt-4">
    <h3>Listar Condiciones de Venta</h3>
    <div class="card">
      <div class="card-header">
        <button type="button" class="btn btn-primary" id="btnAgregar">Agregar</button>
      </div>
      <div class="card-body">
        <table class="table table-striped" id="tbl">
          <thead>
            <tr>
              <th>Descripción</th>
              <th>Código</th>
              <th>Días Crédito</th>
              <th>Permite Cuotas</th>
              <th>Máx. Cuotas</th>
              <th>Estado</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody></tbody>
      </table>
      </div>
    </div>

    <div class="modal" id="modalFormulario">
      <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h4 class="modal-title" id="modalTitle"></h4>
            <button type="button" class="close" data-dismiss="modal">&times;</button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="txtIdCondicionVenta">
            <div class="form-group">
              <label for="txtDescripcion">Descripción: <span class="text-danger">*</span></label>
              <input type="text" class="form-control" placeholder="Ej: Contado, Crédito 30 días" id="txtDescripcion" required>
            </div>
            <div class="form-group">
              <label for="txtCodigo">Código:</label>
              <input type="text" class="form-control" placeholder="Ej: CONTADO, CREDITO_30" id="txtCodigo" maxlength="10">
            </div>
            <div class="form-group">
              <label for="txtDiasCredito">Días de Crédito:</label>
              <input type="number" class="form-control" placeholder="0 = Contado" id="txtDiasCredito" min="0" value="0">
            </div>
            <div class="form-group">
              <label for="chkPermiteCuotas">Permite Cuotas:</label><br>
              <input type="checkbox" id="chkPermiteCuotas"> (Marcar si permite pagos en cuotas)
            </div>
            <div class="form-group">
              <label for="txtNumeroCuotasMax">Número Máximo de Cuotas:</label>
              <input type="number" class="form-control" id="txtNumeroCuotasMax" min="1" value="1">
            </div>
            <div class="form-group">
              <label for="selEstado">Estado: <span class="text-danger">*</span></label>
              <select class="form-control" id="selEstado" required>
                <option value="A">Activo</option>
                <option value="I">Inactivo</option>
              </select>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-primary" id="btnGuardar">Guardar</button>
            <button type="button" class="btn btn-danger" data-dismiss="modal">Cerrar</button>
          </div>
        </div>
      </div>
    </div>
</div>
{% endblock %}

{% block js %}
<script>
  const CSRFToken = "{{ csrf_token() }}" || null;

  const initDatatable = () => {
    $('#tbl').DataTable({
      language: { url: "{{ url_for('static', filename='vendor/datatables/es-ES.json') }}" },
      ajax:'/api/v1/condiciones_venta',
      columns: [
        { data: 'descripcion' },
        { data: 'codigo' },
        { data: 'dias_credito', render: function(val) { return val === 0 ? 'Contado' : val + ' días'; } },
        { data: 'permite_cuotas', render: function(val) {
            return val ? '<span class="badge badge-success">Sí</span>' : '<span class="badge badge-secondary">No</span>';
          }
        },
        { data: 'numero_cuotas_max' },
        { data: 'estado', render: function(val) {
            return val === 'A' ? '<span class="badge badge-success">Activo</span>'
                       : '<span class="badge badge-secondary">Inactivo</span>';
          }
        },
        { data: function(row) {
            return `<button type="button" name="btn_editar" class="btn btn-primary btn-sm" data-id="${row.id}">Editar</button>
                    <button type="button" name="btn_eliminar" class="btn btn-danger btn-sm" data-id="${row.id}">Eliminar</button>`
          }
        }
      ]
    });
  }

  const agregar = () => {
    $('#btnAgregar').on('click', function(){
      $('#modalTitle').text("Agregar Condición de Venta");
      $('#txtIdCondicionVenta').val("");
      $('#txtDescripcion').val("");
      $('#txtCodigo').val("");
      $('#txtDiasCredito').val("0");
      $('#chkPermiteCuotas').prop("checked", false);
      $('#txtNumeroCuotasMax').val("1");
      $('#selEstado').val("A");
      $('#modalFormulario').modal();
    });
  }

  const guardar = () => {
    $('#btnGuardar').on('click', function() {
      const idCondicionVenta = $('#txtIdCondicionVenta').val();
      const descripcion = $('#txtDescripcion').val();
      const codigo = $('#txtCodigo').val();
      const diasCredito = parseInt($('#txtDiasCredito').val()) || 0;
      const permiteCuotas = $('#chkPermiteCuotas').is(':checked');
      const numeroCuotasMax = parseInt($('#txtNumeroCuotasMax').val()) || 1;
      const estado = $('#selEstado').val();
      const tabla = $('#tbl').DataTable();

      if (!descripcion || descripcion.trim() === '') {
        Swal.fire("Error", "La descripción es obligatoria.", "error");
        return;
      }

      const payload = { 
        descripcion: descripcion, 
        codigo: codigo,
        dias_credito: diasCredito,
        permite_cuotas: permiteCuotas,
        numero_cuotas_max: numeroCuotasMax,
        estado: estado 
      };

      const url = idCondicionVenta ? `/api/v1/condiciones_venta/${idCondicionVenta}` : '/api/v1/condiciones_venta';
      const method = idCondicionVenta ? 'PUT' : 'POST';

      fetch(url, {
        method: method,
        headers: { 'Content-Type': 'application/json', 'X-CSRFToken': CSRFToken },
        body: JSON.stringify(payload)
      })
      .then(resp => resp.json())
      .then(data => {
        if(data && !data.error && data.success) {
          tabla.ajax.reload();
          Swal.fire(idCondicionVenta ? "Actualizado" : "Agregado", 
                   `La condición de venta ha sido ${idCondicionVenta ? 'actualizada' : 'agregada'} correctamente.`, 
                   "success");
          $('#modalFormulario').modal("hide");
        } else {
          Swal.fire("Error", data.error || "No se pudo guardar la condición de venta.", "error");
        }
      }).catch(err => {
        console.error(err);
        Swal.fire("Error", "Ocurrió un error.", "error");
      });
    });
  }

  const editar = () => {
    $('#tbl').on('click', 'button[name="btn_editar"]',function(){
      const idCondicionVenta = $(this).data('id');
      $('#modalTitle').text("Editar Condición de Venta");
      $('#txtIdCondicionVenta').val(idCondicionVenta);
      fetch(`/api/v1/condiciones_venta/${idCondicionVenta}`, {
        method: 'GET',
        headers: { 'Content-Type': 'application/json' }
      })
      .then(resp => resp.json())
      .then(data => {
        if (data.success && data.data) {
          $('#txtDescripcion').val(data.data.descripcion);
          $('#txtCodigo').val(data.data.codigo || '');
          $('#txtDiasCredito').val(data.data.dias_credito);
          $('#chkPermiteCuotas').prop("checked", data.data.permite_cuotas);
          $('#txtNumeroCuotasMax').val(data.data.numero_cuotas_max);
          $('#selEstado').val(data.data.estado);
          $('#modalFormulario').modal();
        }
      });
    });
  }

  const eliminar = () => {
    $('#tbl').on('click', 'button[name="btn_eliminar"]',function(){
      const idCondicionVenta = $(this).data('id');
      Swal.fire({
        title: "¿Deseas eliminar este registro?",
        showCancelButton: true,
        confirmButtonText: "Sí",
        cancelButtonText: `No`
      }).then((result) => {
        if (result.isConfirmed) {
          fetch(`/api/v1/condiciones_venta/${idCondicionVenta}`, {
            method: 'DELETE',
            headers: { 'Content-Type': 'application/json', 'X-CSRFToken': CSRFToken }
          })
          .then(resp => resp.json())
          .then(data => {
            if(data && !data.error && data.success) {
              const tabla = $('#tbl').DataTable();
              tabla.ajax.reload();
              Swal.fire("Eliminado", "La condición de venta ha sido eliminada.", "success");
            } else {
              Swal.fire("Error", data.error || "No se pudo eliminar.", "error");
            }
          }).catch(err => {
            Swal.fire("Error", "Ocurrió un error.", "error");
          });
        }
      });
    });
  }

  $(function() {
    initDatatable();
    agregar();
    guardar();
    editar();
    eliminar();
  });
</script>
{% endblock %}
