{% extends 'base.html' %}
    
{% block titulo %}
Cajas
{% endblock %}

{% block contenido %}
<div class="container mt-4">
    <h3>Listar Cajas</h3>
    <div class="card">
      <div class="card-header">
        <button type="button" class="btn btn-primary" id="btnAgregar">Agregar</button>
      </div>
      <div class="card-body">
        <table class="table table-striped" id="tbl">
          <thead>
            <tr>
              <th>Descripción</th>
              <th>Código</th>
              <th>Saldo Inicial</th>
              <th>Saldo Actual</th>
              <th>Estado Caja</th>
              <th>Estado</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody></tbody>
      </table>
      </div>
    </div>

    <div class="modal" id="modalFormulario">
      <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h4 class="modal-title" id="modalTitle"></h4>
            <button type="button" class="close" data-dismiss="modal">&times;</button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="txtIdCaja">
            <div class="form-group">
              <label for="txtDescripcion">Descripción: <span class="text-danger">*</span></label>
              <input type="text" class="form-control" placeholder="Ej: Caja Principal" id="txtDescripcion" required>
            </div>
            <div class="form-group">
              <label for="txtCodigo">Código:</label>
              <input type="text" class="form-control" placeholder="Código de la caja" id="txtCodigo" maxlength="20">
            </div>
            <div class="form-group">
              <label for="txtSaldoInicial">Saldo Inicial (Gs.):</label>
              <input type="number" class="form-control" id="txtSaldoInicial" min="0" value="0">
            </div>
            <div class="form-group">
              <label for="selEstadoCaja">Estado de Caja:</label>
              <select class="form-control" id="selEstadoCaja">
                <option value="CERRADA" selected>Cerrada</option>
                <option value="ABIERTA">Abierta</option>
              </select>
            </div>
            <div class="form-group">
              <label for="selEstado">Estado: <span class="text-danger">*</span></label>
              <select class="form-control" id="selEstado" required>
                <option value="A">Activo</option>
                <option value="I">Inactivo</option>
              </select>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-primary" id="btnGuardar">Guardar</button>
            <button type="button" class="btn btn-danger" data-dismiss="modal">Cerrar</button>
          </div>
        </div>
      </div>
    </div>
</div>
{% endblock %}

{% block js %}
<script>
  const CSRFToken = "{{ csrf_token() }}" || null;

  const formatCurrency = (value) => {
    return new Intl.NumberFormat('es-PY', { 
      style: 'currency', 
      currency: 'PYG',
      minimumFractionDigits: 0,
      maximumFractionDigits: 0
    }).format(value).replace('PYG', 'Gs.');
  }

  const initDatatable = () => {
    $('#tbl').DataTable({
      language: { url: "{{ url_for('static', filename='vendor/datatables/es-ES.json') }}" },
      ajax:'/api/v1/cajas',
      columns: [
        { data: 'descripcion' },
        { data: 'codigo' },
        { data: 'saldo_inicial', render: function(val) { return formatCurrency(val || 0); } },
        { data: 'saldo_actual', render: function(val) { return formatCurrency(val || 0); } },
        { data: 'estado_caja', render: function(val) {
            return val === 'ABIERTA' ? '<span class="badge badge-success">Abierta</span>'
                       : '<span class="badge badge-secondary">Cerrada</span>';
          }
        },
        { data: 'estado', render: function(val) {
            return val === 'A' ? '<span class="badge badge-success">Activo</span>'
                       : '<span class="badge badge-secondary">Inactivo</span>';
          }
        },
        { data: function(row) {
            return `<button type="button" name="btn_editar" class="btn btn-primary btn-sm" data-id="${row.id}">Editar</button>
                    <button type="button" name="btn_eliminar" class="btn btn-danger btn-sm" data-id="${row.id}">Eliminar</button>`
          }
        }
      ]
    });
  }

  const agregar = () => {
    $('#btnAgregar').on('click', function(){
      $('#modalTitle').text("Agregar Caja");
      $('#txtIdCaja').val("");
      $('#txtDescripcion').val("");
      $('#txtCodigo').val("");
      $('#txtSaldoInicial').val("0");
      $('#selEstadoCaja').val("CERRADA");
      $('#selEstado').val("A");
      $('#modalFormulario').modal();
    });
  }

  const guardar = () => {
    $('#btnGuardar').on('click', function() {
      const idCaja = $('#txtIdCaja').val();
      const descripcion = $('#txtDescripcion').val();
      const codigo = $('#txtCodigo').val();
      const saldoInicial = parseInt($('#txtSaldoInicial').val()) || 0;
      const estadoCaja = $('#selEstadoCaja').val();
      const estado = $('#selEstado').val();
      const tabla = $('#tbl').DataTable();

      if (!descripcion || descripcion.trim() === '') {
        Swal.fire("Error", "La descripción es obligatoria.", "error");
        return;
      }

      const payload = { 
        descripcion: descripcion, 
        codigo: codigo,
        saldo_inicial: saldoInicial,
        estado_caja: estadoCaja,
        estado: estado 
      };

      const url = idCaja ? `/api/v1/cajas/${idCaja}` : '/api/v1/cajas';
      const method = idCaja ? 'PUT' : 'POST';

      fetch(url, {
        method: method,
        headers: { 'Content-Type': 'application/json', 'X-CSRFToken': CSRFToken },
        body: JSON.stringify(payload)
      })
      .then(resp => resp.json())
      .then(data => {
        if(data && !data.error && data.success) {
          tabla.ajax.reload();
          Swal.fire(idCaja ? "Actualizado" : "Agregado", 
                   `La caja ha sido ${idCaja ? 'actualizada' : 'agregada'} correctamente.`, 
                   "success");
          $('#modalFormulario').modal("hide");
        } else {
          Swal.fire("Error", data.error || "No se pudo guardar la caja.", "error");
        }
      }).catch(err => {
        console.error(err);
        Swal.fire("Error", "Ocurrió un error.", "error");
      });
    });
  }

  const editar = () => {
    $('#tbl').on('click', 'button[name="btn_editar"]',function(){
      const idCaja = $(this).data('id');
      $('#modalTitle').text("Editar Caja");
      $('#txtIdCaja').val(idCaja);
      fetch(`/api/v1/cajas/${idCaja}`, {
        method: 'GET',
        headers: { 'Content-Type': 'application/json' }
      })
      .then(resp => resp.json())
      .then(data => {
        if (data.success && data.data) {
          $('#txtDescripcion').val(data.data.descripcion);
          $('#txtCodigo').val(data.data.codigo || '');
          $('#txtSaldoInicial').val(data.data.saldo_inicial || 0);
          $('#selEstadoCaja').val(data.data.estado_caja || 'CERRADA');
          $('#selEstado').val(data.data.estado);
          $('#modalFormulario').modal();
        }
      });
    });
  }

  const eliminar = () => {
    $('#tbl').on('click', 'button[name="btn_eliminar"]',function(){
      const idCaja = $(this).data('id');
      Swal.fire({
        title: "¿Deseas eliminar este registro?",
        showCancelButton: true,
        confirmButtonText: "Sí",
        cancelButtonText: `No`
      }).then((result) => {
        if (result.isConfirmed) {
          fetch(`/api/v1/cajas/${idCaja}`, {
            method: 'DELETE',
            headers: { 'Content-Type': 'application/json', 'X-CSRFToken': CSRFToken }
          })
          .then(resp => resp.json())
          .then(data => {
            if(data && !data.error && data.success) {
              const tabla = $('#tbl').DataTable();
              tabla.ajax.reload();
              Swal.fire("Eliminado", "La caja ha sido eliminada.", "success");
            } else {
              Swal.fire("Error", data.error || "No se pudo eliminar.", "error");
            }
          }).catch(err => {
            Swal.fire("Error", "Ocurrió un error.", "error");
          });
        }
      });
    });
  }

  $(function() {
    initDatatable();
    agregar();
    guardar();
    editar();
    eliminar();
  });
</script>
{% endblock %}
