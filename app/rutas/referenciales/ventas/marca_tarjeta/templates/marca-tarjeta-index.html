{% extends 'base.html' %}
    
{% block titulo %}
Marcas de Tarjeta
{% endblock %}

{% block contenido %}
<div class="container mt-4">
    <h3>Listar Marcas de Tarjeta</h3>
    <div class="card">
      <div class="card-header">
        <button type="button" class="btn btn-primary" id="btnAgregar">Agregar</button>
      </div>
      <div class="card-body">
        <table class="table table-striped" id="tbl">
          <thead>
            <tr>
              <th>Descripción</th>
              <th>Código</th>
              <th>Estado</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody></tbody>
      </table>
      </div>
    </div>

    <div class="modal" id="modalFormulario">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h4 class="modal-title" id="modalTitle"></h4>
            <button type="button" class="close" data-dismiss="modal">&times;</button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="txtIdMarcaTarjeta">
            <div class="form-group">
              <label for="txtDescripcion">Descripción: <span class="text-danger">*</span></label>
              <input type="text" class="form-control" placeholder="Ej: Visa, Mastercard" id="txtDescripcion" required>
            </div>
            <div class="form-group">
              <label for="txtCodigo">Código:</label>
              <input type="text" class="form-control" placeholder="Ej: VISA, MASTERCARD" id="txtCodigo" maxlength="10">
            </div>
            <div class="form-group">
              <label for="selEstado">Estado: <span class="text-danger">*</span></label>
              <select class="form-control" id="selEstado" required>
                <option value="A">Activo</option>
                <option value="I">Inactivo</option>
              </select>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-primary" id="btnGuardar">Guardar</button>
            <button type="button" class="btn btn-danger" data-dismiss="modal">Cerrar</button>
          </div>
        </div>
      </div>
    </div>
</div>
{% endblock %}

{% block js %}
<script>
  const CSRFToken = "{{ csrf_token() }}" || null;

  const initDatatable = () => {
    $('#tbl').DataTable({
      language: { url: "{{ url_for('static', filename='vendor/datatables/es-ES.json') }}" },
      ajax:'/api/v1/marcas_tarjeta',
      columns: [
        { data: 'descripcion' },
        { data: 'codigo' },
        { data: 'estado', render: function(val) {
            return val === 'A' ? '<span class="badge badge-success">Activo</span>'
                       : '<span class="badge badge-secondary">Inactivo</span>';
          }
        },
        { data: function(row) {
            return `<button type="button" name="btn_editar" class="btn btn-primary btn-sm" data-id="${row.id}">Editar</button>
                    <button type="button" name="btn_eliminar" class="btn btn-danger btn-sm" data-id="${row.id}">Eliminar</button>`
          }
        }
      ]
    });
  }

  const agregar = () => {
    $('#btnAgregar').on('click', function(){
      $('#modalTitle').text("Agregar Marca de Tarjeta");
      $('#txtIdMarcaTarjeta').val("");
      $('#txtDescripcion').val("");
      $('#txtCodigo').val("");
      $('#selEstado').val("A");
      $('#modalFormulario').modal();
    });
  }

  const guardar = () => {
    $('#btnGuardar').on('click', function() {
      const idMarcaTarjeta = $('#txtIdMarcaTarjeta').val();
      const descripcion = $('#txtDescripcion').val();
      const codigo = $('#txtCodigo').val();
      const estado = $('#selEstado').val();
      const tabla = $('#tbl').DataTable();

      if (!descripcion || descripcion.trim() === '') {
        Swal.fire("Error", "La descripción es obligatoria.", "error");
        return;
      }

      const payload = { descripcion: descripcion, codigo: codigo, estado: estado };

      const url = idMarcaTarjeta ? `/api/v1/marcas_tarjeta/${idMarcaTarjeta}` : '/api/v1/marcas_tarjeta';
      const method = idMarcaTarjeta ? 'PUT' : 'POST';

      fetch(url, {
        method: method,
        headers: { 'Content-Type': 'application/json', 'X-CSRFToken': CSRFToken },
        body: JSON.stringify(payload)
      })
      .then(resp => resp.json())
      .then(data => {
        if(data && !data.error && data.success) {
          tabla.ajax.reload();
          Swal.fire(idMarcaTarjeta ? "Actualizado" : "Agregado", 
                   `La marca de tarjeta ha sido ${idMarcaTarjeta ? 'actualizada' : 'agregada'} correctamente.`, 
                   "success");
          $('#modalFormulario').modal("hide");
        } else {
          Swal.fire("Error", data.error || "No se pudo guardar la marca de tarjeta.", "error");
        }
      }).catch(err => {
        console.error(err);
        Swal.fire("Error", "Ocurrió un error.", "error");
      });
    });
  }

  const editar = () => {
    $('#tbl').on('click', 'button[name="btn_editar"]',function(){
      const idMarcaTarjeta = $(this).data('id');
      $('#modalTitle').text("Editar Marca de Tarjeta");
      $('#txtIdMarcaTarjeta').val(idMarcaTarjeta);
      fetch(`/api/v1/marcas_tarjeta/${idMarcaTarjeta}`, {
        method: 'GET',
        headers: { 'Content-Type': 'application/json' }
      })
      .then(resp => resp.json())
      .then(data => {
        if (data.success && data.data) {
          $('#txtDescripcion').val(data.data.descripcion);
          $('#txtCodigo').val(data.data.codigo || '');
          $('#selEstado').val(data.data.estado);
          $('#modalFormulario').modal();
        }
      });
    });
  }

  const eliminar = () => {
    $('#tbl').on('click', 'button[name="btn_eliminar"]',function(){
      const idMarcaTarjeta = $(this).data('id');
      Swal.fire({
        title: "¿Deseas eliminar este registro?",
        showCancelButton: true,
        confirmButtonText: "Sí",
        cancelButtonText: `No`
      }).then((result) => {
        if (result.isConfirmed) {
          fetch(`/api/v1/marcas_tarjeta/${idMarcaTarjeta}`, {
            method: 'DELETE',
            headers: { 'Content-Type': 'application/json', 'X-CSRFToken': CSRFToken }
          })
          .then(resp => resp.json())
          .then(data => {
            if(data && !data.error && data.success) {
              const tabla = $('#tbl').DataTable();
              tabla.ajax.reload();
              Swal.fire("Eliminado", "La marca de tarjeta ha sido eliminada.", "success");
            } else {
              Swal.fire("Error", data.error || "No se pudo eliminar.", "error");
            }
          }).catch(err => {
            Swal.fire("Error", "Ocurrió un error.", "error");
          });
        }
      });
    });
  }

  $(function() {
    initDatatable();
    agregar();
    guardar();
    editar();
    eliminar();
  });
</script>
{% endblock %}
