{% extends 'base.html' %}

{% block titulo %}
Consultorios
{% endblock %}

{% block contenido %}
<header class="page-header page-header-dark bg-gradient-primary-to-secondary pb-10">
  <div class="container-fluid px-4">
    <div class="page-header-content pt-4">
      <div class="row align-items-center justify-content-between">
        <div class="col-auto mt-4">
          <h1 class="page-header-title">Gestión de Consultorios</h1>
          <div class="page-header-subtitle">Consultorios físicos de cada sede</div>
        </div>
        <div class="col-auto mt-4">
          <a class="btn btn-outline-light btn-sm" href="{{ url_for('referenciales.referencialesIndex') }}">Volver al Listado</a>
        </div>
      </div>
    </div>
  </div>
</header>

<div class="container-fluid px-4 mt-n10">

  <div class="card shadow-sm mb-4">
    <div class="card-header py-3 d-flex align-items-center">
      <h6 class="m-0 fw-bold">Listado de Consultorios</h6>
      <button type="button" class="btn btn-sm btn-primary ms-auto" id="btnAgregar">Agregar</button>
    </div>
    <div class="card-body">
      <div class="table-responsive">
        <table class="table table-hover table-bordered align-middle w-100" id="tbl">
          <thead class="table-light">
            <tr>
              <th>#</th>
              <th>Consultorio</th>
              <th>Sede</th>
              <th>Estado</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- Modal formulario -->
<div class="modal fade" id="modalFormulario" tabindex="-1" data-bs-backdrop="static">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow">
      <div class="modal-header border-bottom">
        <h5 class="modal-title fw-bold" id="modalTitle">Nuevo Consultorio</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="txtIdConsultorio">
        <div class="form-group">
          <label class="fw-semibold">Sede <span class="text-danger">*</span></label>
          <select class="form-select" id="selSede">
            <option value="">Seleccione una sede</option>
          </select>
        </div>
        <div class="form-group mt-3">
          <label class="fw-semibold">Descripción <span class="text-danger">*</span></label>
          <input type="text" class="form-control" placeholder="Ingrese el consultorio" id="txtDescripcion">
        </div>
        <div class="form-group mt-3">
          <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" id="chkEstado" checked>
            <label class="form-check-label fw-semibold" for="chkEstado">Activo</label>
          </div>
        </div>
      </div>
      <div class="modal-footer bg-light">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-primary" id="btnGuardar">
          <i data-feather="save" class="icon-sm"></i> Guardar
        </button>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block js %}
<script>
  const CSRFToken = "{{ csrf_token() }}";
  let sedesCache = [];

  const cargarSedes = () => {
    return fetch('/api/v1/sedes')
      .then(resp => resp.json())
      .then(data => {
        if (data.success) {
          sedesCache = data.data;
          const sel = $('#selSede');
          sedesCache.forEach(s => {
            sel.append(`<option value="${s.id_sede}">${s.des_sede}</option>`);
          });
        }
      });
  }

  const nombreSede = (id_sede) => {
    const sede = sedesCache.find(s => s.id_sede === id_sede);
    return sede ? sede.des_sede : '-';
  }

  const initDatatable = () => {
    $('#tbl').DataTable({
      language: { url: "{{ url_for('static', filename='vendor/datatables/es-ES.json') }}" },
      ajax: {
        url: '/api/v1/consultorios',
        dataSrc: 'data'
      },
      columns: [
        {
          data: null,
          orderable: false,
          render: function (data, type, row, meta) { return meta.row + 1; }
        },
        { data: 'des_consultorio' },
        { data: 'des_sede' },
        {
          data: function (row) {
            return row.est_consultorio
              ? '<span class="badge rounded-pill border border-success text-success">Activo</span>'
              : '<span class="badge rounded-pill border border-secondary text-secondary">Inactivo</span>';
          },
          className: 'text-center'
        },
        {
          data: function (row) {
            return `<button class="btn btn-sm btn-outline-primary" type="button" name="btn_editar" data-id="${row.id_consultorio}">Editar</button>`;
          },
          className: 'text-center',
          orderable: false
        }
      ],
      order: [[1, 'asc']]
    });
  }

  const agregar = () => {
    $('#btnAgregar').on('click', function () {
      $('#modalTitle').text('Nuevo Consultorio');
      $('#txtIdConsultorio').val('');
      $('#selSede').val('');
      $('#txtDescripcion').val('');
      $('#chkEstado').prop('checked', true);
      new bootstrap.Modal(document.getElementById('modalFormulario')).show();
    });
  }

  const guardar = () => {
    $('#btnGuardar').on('click', function () {
      const idConsultorio = $('#txtIdConsultorio').val();
      const idSede = $('#selSede').val();
      const descripcion = $('#txtDescripcion').val().trim();

      if (!idSede) {
        Swal.fire('Atención', 'La sede es obligatoria.', 'warning');
        return;
      }
      if (!descripcion) {
        Swal.fire('Atención', 'La descripción es obligatoria.', 'warning');
        return;
      }

      const payload = {
        id_sede: idSede,
        des_consultorio: descripcion,
        est_consultorio: $('#chkEstado').is(':checked')
      };
      const url = idConsultorio ? `/api/v1/consultorios/${idConsultorio}` : '/api/v1/consultorios';
      const method = idConsultorio ? 'PUT' : 'POST';

      fetch(url, {
        method: method,
        headers: { 'Content-Type': 'application/json', 'X-CSRFToken': CSRFToken },
        body: JSON.stringify(payload)
      })
        .then(resp => resp.json())
        .then(data => {
          if (data.success) {
            $('#tbl').DataTable().ajax.reload();
            bootstrap.Modal.getInstance(document.getElementById('modalFormulario')).hide();
            Swal.fire('Éxito', idConsultorio ? 'Consultorio actualizado.' : 'Consultorio agregado.', 'success');
          } else {
            Swal.fire('Error', data.error || 'No se pudo guardar el consultorio.', 'error');
          }
        })
        .catch(() => Swal.fire('Error', 'Ocurrió un error al guardar el consultorio.', 'error'));
    });
  }

  const editar = () => {
    $('#tbl tbody').on('click', 'button[name="btn_editar"]', function () {
      const idConsultorio = $(this).data('id');

      fetch(`/api/v1/consultorios/${idConsultorio}`)
        .then(resp => resp.json())
        .then(data => {
          if (!data.success) {
            Swal.fire('Error', data.error || 'No se pudo cargar el consultorio.', 'error');
            return;
          }
          $('#modalTitle').text('Editar Consultorio');
          $('#txtIdConsultorio').val(data.data.id_consultorio);
          $('#selSede').val(data.data.id_sede);
          $('#txtDescripcion').val(data.data.des_consultorio);
          $('#chkEstado').prop('checked', data.data.est_consultorio);
          new bootstrap.Modal(document.getElementById('modalFormulario')).show();
        });
    });
  }

  $(function () {
    cargarSedes().then(initDatatable);
    agregar();
    guardar();
    editar();
  });
</script>
{% endblock %}
