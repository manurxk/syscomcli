{% extends 'base.html' %}

{% block titulo %}
Calendario de Citas
{% endblock %}

{% block head_extra %}
<!-- FullCalendar CSS -->
<link href='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.css' rel='stylesheet' />
<style>
/* Variables personalizadas */
:root {
    --fc-border-color: #f1f5f9;
    --fc-today-bg-color: #f0f9ff;
}

/* Estilos modernos para FullCalendar */
.fc {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
}

/* Toolbar mejorado */
.fc .fc-toolbar {
    padding: 1rem 0;
    gap: 1rem;
}

.fc .fc-toolbar-title {
    font-size: 1.5rem;
    font-weight: 700;
    color: #0f172a;
    letter-spacing: -0.02em;
}

/* Botones modernos */
.fc .fc-button {
    font-weight: 500;
    text-transform: capitalize;
    padding: 0.625rem 1.25rem;
    border-radius: 0.75rem;
    font-size: 0.875rem;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    border: none;
    box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
}

.fc .fc-button-primary {
    background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
    color: white;
}

.fc .fc-button-primary:hover {
    background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    transform: translateY(-1px);
}

.fc .fc-button-primary:active,
.fc .fc-button-primary:focus {
    background: linear-gradient(135deg, #1d4ed8 0%, #1e40af 100%);
    box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
}

.fc .fc-button-primary:disabled {
    background: #cbd5e1;
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
}

.fc .fc-button-active {
    background: linear-gradient(135deg, #1e40af 0%, #1e3a8a 100%) !important;
}

/* Grupo de botones */
.fc .fc-button-group {
    border-radius: 0.75rem;
    overflow: hidden;
    box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
}

.fc .fc-button-group > .fc-button {
    border-radius: 0;
    margin: 0;
}

.fc .fc-button-group > .fc-button:first-child {
    border-radius: 0.75rem 0 0 0.75rem;
}

.fc .fc-button-group > .fc-button:last-child {
    border-radius: 0 0.75rem 0.75rem 0;
}

/* Encabezados de día mejorados */
.fc .fc-col-header-cell {
    padding: 1rem 0.5rem;
    font-weight: 600;
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #64748b;
    background: #f8fafc;
    border-color: #f1f5f9;
}

/* Celdas de día */
.fc .fc-daygrid-day {
    transition: background-color 0.2s;
}

.fc .fc-daygrid-day:hover {
    background-color: #f8fafc;
}

.fc .fc-daygrid-day-number {
    padding: 0.5rem;
    font-weight: 500;
    color: #475569;
}

/* Día actual destacado */
.fc .fc-day-today {
    background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%) !important;
}

.fc .fc-day-today .fc-daygrid-day-number {
    background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
    color: white;
    border-radius: 0.5rem;
    width: 2rem;
    height: 2rem;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-weight: 600;
}

/* Eventos mejorados */
.fc .fc-daygrid-event {
    border-radius: 0.5rem;
    padding: 0.375rem 0.625rem;
    font-size: 0.8125rem;
    font-weight: 500;
    border: none;
    margin: 2px 4px;
    box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}

.fc .fc-daygrid-event:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    filter: brightness(1.05);
    cursor: pointer;
}

.fc .fc-timegrid-event {
    border-radius: 0.5rem;
    border: none;
    box-shadow: 0 2px 4px 0 rgba(0, 0, 0, 0.08);
    transition: all 0.2s;
}

.fc .fc-timegrid-event:hover {
    transform: scale(1.02);
    box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.12);
}

/* Más eventos link */
.fc .fc-daygrid-more-link {
    color: #3b82f6;
    font-weight: 600;
    font-size: 0.75rem;
    padding: 0.25rem 0.5rem;
    border-radius: 0.375rem;
    transition: all 0.2s;
}

.fc .fc-daygrid-more-link:hover {
    background: #eff6ff;
    color: #2563eb;
}

/* Scrollbar personalizado */
.custom-scrollbar::-webkit-scrollbar {
    width: 8px;
    height: 8px;
}

.custom-scrollbar::-webkit-scrollbar-track {
    background: #f1f5f9;
    border-radius: 4px;
}

.custom-scrollbar::-webkit-scrollbar-thumb {
    background: linear-gradient(135deg, #cbd5e1 0%, #94a3b8 100%);
    border-radius: 4px;
}

.custom-scrollbar::-webkit-scrollbar-thumb:hover {
    background: linear-gradient(135deg, #94a3b8 0%, #64748b 100%);
}

/* Bordes suaves */
.fc table {
    border-collapse: separate;
    border-spacing: 0;
}

.fc td,
.fc th {
    border-color: #f1f5f9;
}

/* Animaciones */
@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(-10px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.fc-event {
    animation: fadeIn 0.3s ease-out;
}

/* Popover mejorado */
.fc .fc-popover {
    border-radius: 0.75rem;
    border: none;
    box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
}
</style>
{% endblock %}

{% block contenido %}
<div class="min-h-screen bg-gradient-to-br from-slate-50 via-blue-50 to-slate-50">
    <!-- Header mejorado -->
    <div class="bg-white/80 backdrop-blur-xl border-b border-slate-200/60 sticky top-0 z-40 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
                <div class="flex items-center space-x-4">
                    <div class="p-3 bg-gradient-to-br from-blue-500 to-blue-600 rounded-2xl shadow-lg shadow-blue-500/30">
                        <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                        </svg>
                    </div>
                    <div>
                        <h1 class="text-3xl font-bold bg-gradient-to-r from-slate-900 to-slate-700 bg-clip-text text-transparent">
                            Calendario de Citas
                        </h1>
                        <p class="text-sm text-slate-600 mt-1 font-medium">
                            <span id="fechaHoy"></span>
                        </p>
                    </div>
                </div>
                
                <!-- Stats rápidos -->
                <div class="flex gap-3">
                    <div class="px-4 py-2 bg-gradient-to-br from-blue-50 to-blue-100 rounded-xl border border-blue-200/50">
                        <p class="text-xs text-blue-600 font-medium">Citas del mes</p>
                        <p class="text-xl font-bold text-blue-700" id="totalCitasMes">0</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Contenido Principal -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Calendario mejorado -->
        <div class="bg-white rounded-2xl shadow-xl shadow-slate-200/50 overflow-hidden border border-slate-200/60 backdrop-blur-sm">
            <div id="calendario" class="p-6"></div>
        </div>

        <!-- Leyenda modernizada -->
        <div id="leyendaEstados" class="mt-6 bg-white rounded-2xl shadow-lg shadow-slate-200/50 p-6 border border-slate-200/60">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-base font-semibold text-slate-800 flex items-center">
                    <svg class="w-5 h-5 text-blue-500 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21a4 4 0 01-4-4V5a2 2 0 012-2h4a2 2 0 012 2v12a4 4 0 01-4 4zm0 0h12a2 2 0 002-2v-4a2 2 0 00-2-2h-2.343M11 7.343l1.657-1.657a2 2 0 012.828 0l2.829 2.829a2 2 0 010 2.828l-8.486 8.485M7 17h.01"/>
                    </svg>
                    Estados de Citas
                </h3>
            </div>
            <div class="flex flex-wrap gap-4">
                <!-- Se llena dinámicamente -->
            </div>
        </div>

</div>

<!-- Modal Detalle Mejorado -->
<div id="modalDetalleCita" class="fixed inset-0 z-50 overflow-y-auto hidden" aria-labelledby="modal-title" role="dialog" aria-modal="true">
    <div class="flex items-center justify-center min-h-screen px-4 pt-4 pb-20 text-center sm:p-0">
        <!-- Overlay con blur -->
        <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm transition-opacity" aria-hidden="true"></div>

        <!-- Modal -->
        <div class="inline-block align-bottom bg-white rounded-2xl text-left overflow-hidden shadow-2xl transform transition-all sm:my-8 sm:align-middle sm:max-w-2xl sm:w-full">
            <!-- Header del modal -->
            <div class="bg-gradient-to-r from-blue-500 to-blue-600 px-6 py-4">
                <h3 class="text-xl font-bold text-white flex items-center" id="modal-title">
                    <div class="p-2 bg-white/20 rounded-lg mr-3">
                        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                        </svg>
                    </div>
                    Detalle de la Cita
                </h3>
            </div>
            
            <!-- Contenido -->
            <div class="px-6 py-6">
                <div id="contenidoDetalle" class="text-slate-700">
                    <!-- Se llena dinámicamente -->
                </div>
            </div>
            
            <!-- Footer -->
            <div class="bg-slate-50 px-6 py-4 flex justify-end gap-3">
                <button id="btnCerrarModal" type="button" class="px-6 py-2.5 bg-white border-2 border-slate-300 text-slate-700 rounded-xl font-semibold hover:bg-slate-50 hover:border-slate-400 focus:outline-none focus:ring-4 focus:ring-slate-200 transition-all duration-200 shadow-sm">
                    Cerrar
                </button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block js %}
<!-- FullCalendar JS -->
<script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js'></script>
<script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/locales/es.global.min.js'></script>

<script>
// Variables globales
let calendar = null;
let citasData = [];

// Inicialización
document.addEventListener('DOMContentLoaded', function() {
    inicializarComponentes();
});

// Inicializar todos los componentes
function inicializarComponentes() {
    mostrarFechaHoy();
    inicializarCalendario();
    cargarEstadosYFiltros();
    configurarEventos();
}

// Inicializar FullCalendar
function inicializarCalendario() {
    const calendarEl = document.getElementById('calendario');
    
    calendar = new FullCalendar.Calendar(calendarEl, {
        locale: 'es',
        initialView: 'dayGridMonth',
        headerToolbar: {
            left: 'prev,next today',
            center: 'title',
            right: 'dayGridMonth,timeGridWeek,timeGridDay'
        },
        buttonText: {
            today: 'Hoy',
            month: 'Mes',
            week: 'Semana',
            day: 'Día'
        },
        events: cargarEventos,
        eventClick: mostrarDetalleCita,
        eventDidMount: agregarTooltip,
        height: 'auto',
        navLinks: true,
        nowIndicator: true,
        editable: false,
        dayMaxEvents: 4,
        eventTimeFormat: {
            hour: '2-digit',
            minute: '2-digit',
            hour12: false
        }
    });
    
    calendar.render();
}

// Cargar eventos desde la API
async function cargarEventos(fetchInfo, successCallback, failureCallback) {
    try {
        const response = await fetch('/api/v1/citas');
        const data = await response.json();
        
        if (data.success && data.data) {
            citasData = data.data;
            
            // Actualizar contador
            document.getElementById('totalCitasMes').textContent = data.data.length;
            
            const eventos = data.data.map(cita => {
                const fechaParts = cita.cita_fecha.split('/');
                const fechaFormateada = `${fechaParts[2]}-${fechaParts[1]}-${fechaParts[0]}`;
                
                // Iconos por tipo
                const iconos = {
                    'PRIMERA_VEZ': '👤',
                    'EVALUACION': '📋',
                    'TRATAMIENTO': '💊',
                    'SEGUIMIENTO': '🔄'
                };
                
                const icono = iconos[cita.cita_tipo] || '📅';
                
                return {
                    id: cita.id_cita,
                    title: `${icono} ${cita.paciente_nombre.split(' ')[0]}`,
                    start: `${fechaFormateada}T${cita.cita_hora_inicio}`,
                    end: `${fechaFormateada}T${cita.cita_hora_fin}`,
                    backgroundColor: cita.estado_color || '#3b82f6',
                    borderColor: cita.estado_color || '#3b82f6',
                    textColor: '#ffffff',
                    extendedProps: { cita }
                };
            });
            
            successCallback(eventos);
        } else {
            successCallback([]);
        }
    } catch (error) {
        console.error('Error cargando citas:', error);
        successCallback([]);
    }
}

// Mostrar detalle de cita
function mostrarDetalleCita(info) {
    const cita = info.event.extendedProps.cita;
    
    const tipoTextos = {
        'PRIMERA_VEZ': 'Primera Vez',
        'EVALUACION': 'Evaluación',
        'TRATAMIENTO': 'Tratamiento',
        'SEGUIMIENTO': 'Seguimiento'
    };
    
    const tipoIconos = {
        'PRIMERA_VEZ': '👤',
        'EVALUACION': '📋',
        'TRATAMIENTO': '💊',
        'SEGUIMIENTO': '🔄'
    };
    
    const html = `
        <div class="space-y-5">
            <!-- Estado y Paciente -->
            <div class="flex items-start justify-between p-4 bg-gradient-to-br from-slate-50 to-slate-100 rounded-xl border border-slate-200">
                <div class="flex-1">
                    <p class="text-xs font-medium text-slate-500 mb-1 uppercase tracking-wider">Paciente</p>
                    <p class="text-xl font-bold text-slate-800">${cita.paciente_nombre}</p>
                </div>
                <span class="px-4 py-2 text-sm font-bold rounded-xl shadow-lg" style="background: linear-gradient(135deg, ${cita.estado_color} 0%, ${ajustarBrillo(cita.estado_color, -20)} 100%); color: white;">
                    ${cita.estado_nombre}
                </span>
            </div>
            
            <!-- Grid de información -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Especialista -->
                <div class="p-4 bg-blue-50 rounded-xl border border-blue-100">
                    <div class="flex items-center mb-2">
                        <div class="p-2 bg-blue-500 rounded-lg mr-3">
                            <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                            </svg>
                        </div>
                        <p class="text-xs font-semibold text-blue-700 uppercase tracking-wider">Especialista</p>
                    </div>
                    <p class="font-bold text-slate-800">${cita.especialista_nombre}</p>
                </div>
                
                <!-- Especialidad -->
                <div class="p-4 bg-purple-50 rounded-xl border border-purple-100">
                    <div class="flex items-center mb-2">
                        <div class="p-2 bg-purple-500 rounded-lg mr-3">
                            <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"/>
                            </svg>
                        </div>
                        <p class="text-xs font-semibold text-purple-700 uppercase tracking-wider">Especialidad</p>
                    </div>
                    <p class="font-bold text-slate-800">${cita.especialidad}</p>
                </div>
            </div>
            
            <!-- Fecha y Hora -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="p-4 bg-emerald-50 rounded-xl border border-emerald-100">
                    <div class="flex items-center mb-2">
                        <div class="p-2 bg-emerald-500 rounded-lg mr-3">
                            <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                            </svg>
                        </div>
                        <p class="text-xs font-semibold text-emerald-700 uppercase tracking-wider">Fecha</p>
                    </div>
                    <p class="font-bold text-slate-800">${formatearFecha(cita.cita_fecha)}</p>
                </div>
                
                <div class="p-4 bg-amber-50 rounded-xl border border-amber-100">
                    <div class="flex items-center mb-2">
                        <div class="p-2 bg-amber-500 rounded-lg mr-3">
                            <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
                            </svg>
                        </div>
                        <p class="text-xs font-semibold text-amber-700 uppercase tracking-wider">Horario</p>
                    </div>
                    <p class="font-bold text-slate-800">${cita.cita_hora_inicio.substring(0,5)} - ${cita.cita_hora_fin.substring(0,5)}</p>
                </div>
            </div>
            
            <!-- Tipo de cita -->
            <div class="p-4 bg-gradient-to-br from-indigo-50 to-indigo-100 rounded-xl border border-indigo-200">
                <div class="flex items-center">
                    <span class="text-2xl mr-3">${tipoIconos[cita.cita_tipo] || '📅'}</span>
                    <div>
                        <p class="text-xs font-semibold text-indigo-700 uppercase tracking-wider mb-1">Tipo de Cita</p>
                        <p class="font-bold text-slate-800">${tipoTextos[cita.cita_tipo] || cita.cita_tipo}</p>
                    </div>
                </div>
            </div>
            
            ${cita.cita_motivo ? `
            <div class="p-4 bg-slate-50 rounded-xl border border-slate-200">
                <div class="flex items-start">
                    <div class="p-2 bg-slate-500 rounded-lg mr-3 mt-1">
                        <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                        </svg>
                    </div>
                    <div class="flex-1">
                        <p class="text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">Motivo de Consulta</p>
                        <p class="text-slate-700 leading-relaxed">${cita.cita_motivo}</p>
                    </div>
                </div>
            </div>
            ` : ''}
        </div>
    `;
    
    document.getElementById('contenidoDetalle').innerHTML = html;
    
    // Mostrar modal con animación
    const modal = document.getElementById('modalDetalleCita');
    modal.classList.remove('hidden');
    setTimeout(() => modal.classList.add('show'), 10);
}

// Agregar tooltip a eventos
function agregarTooltip(info) {
    const cita = info.event.extendedProps.cita;
    const tooltip = `${cita.paciente_nombre}\n${cita.especialista_nombre}\n${cita.cita_hora_inicio.substring(0,5)} - ${cita.cita_hora_fin.substring(0,5)}`;
    
    info.el.title = tooltip;
}

// Cargar estados y filtros
async function cargarEstadosYFiltros() {
    try {
        const estadosRes = await fetch('/api/v1/estados-citas');
        const estadosData = await estadosRes.json();
        
        if (estadosData.success) {
            const leyendaContainer = document.getElementById('leyendaEstados').querySelector('.flex');
            
            estadosData.data.forEach(estado => {
                const leyendaItem = document.createElement('div');
                leyendaItem.className = 'group flex items-center space-x-3 px-4 py-2.5 bg-slate-50 hover:bg-slate-100 rounded-xl border border-slate-200 transition-all duration-200 cursor-default';
                leyendaItem.innerHTML = `
                    <div class="relative">
                        <div class="w-4 h-4 rounded-full shadow-sm" style="background: linear-gradient(135deg, ${estado.color} 0%, ${ajustarBrillo(estado.color, -20)} 100%)"></div>
                        <div class="absolute inset-0 w-4 h-4 rounded-full animate-ping opacity-25" style="background-color: ${estado.color}"></div>
                    </div>
                    <span class="text-sm font-semibold text-slate-700 group-hover:text-slate-900 transition-colors">${estado.nombre}</span>
                `;
                leyendaContainer.appendChild(leyendaItem);
            });
        }
        
    } catch (error) {
        console.error('Error cargando estados:', error);
    }
}

// Configurar eventos de UI
function configurarEventos() {
    // Cerrar modal
    document.getElementById('btnCerrarModal').addEventListener('click', function() {
        document.getElementById('modalDetalleCita').classList.add('hidden');
    });
    
    // Cerrar modal con overlay
    document.getElementById('modalDetalleCita').addEventListener('click', function(e) {
        if (e.target.id === 'modalDetalleCita') {
            this.classList.add('hidden');
        }
    });
    
    // Cerrar modal con tecla ESC
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            document.getElementById('modalDetalleCita').classList.add('hidden');
        }
    });
}

// Utilidades
function mostrarFechaHoy() {
    const hoy = new Date();
    const opciones = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
    const fechaFormateada = hoy.toLocaleDateString('es-ES', opciones);
    // Capitalizar primera letra
    document.getElementById('fechaHoy').textContent = fechaFormateada.charAt(0).toUpperCase() + fechaFormateada.slice(1);
}

function formatearFecha(fechaStr) {
    const partes = fechaStr.split('/');
    const fecha = new Date(partes[2], partes[1] - 1, partes[0]);
    const fechaFormateada = fecha.toLocaleDateString('es-ES', { 
        weekday: 'long',
        year: 'numeric',
        month: 'long',
        day: 'numeric'
    });
    // Capitalizar primera letra
    return fechaFormateada.charAt(0).toUpperCase() + fechaFormateada.slice(1);
}

function ajustarBrillo(color, porcentaje) {
    // Convierte color hex a RGB y ajusta el brillo
    const num = parseInt(color.replace('#', ''), 16);
    const amt = Math.round(2.55 * porcentaje);
    const R = (num >> 16) + amt;
    const G = (num >> 8 & 0x00FF) + amt;
    const B = (num & 0x0000FF) + amt;
    return '#' + (0x1000000 + (R < 255 ? R < 1 ? 0 : R : 255) * 0x10000 +
        (G < 255 ? G < 1 ? 0 : G : 255) * 0x100 +
        (B < 255 ? B < 1 ? 0 : B : 255))
        .toString(16).slice(1);
}

// Auto-refresh cada 5 minutos
setInterval(() => {
    if (calendar) {
        calendar.refetchEvents();
    }
}, 300000);
