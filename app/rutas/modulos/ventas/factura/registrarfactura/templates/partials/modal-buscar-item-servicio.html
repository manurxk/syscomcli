<!-- Modal Buscar Item/Servicio (estilo uniforme con Buscar Paciente) -->
<div class="modal fade" id="modalBuscarItemServicio" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content">
      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title">Buscar Item / Servicio</h5>
        <button type="button" class="close text-white" data-dismiss="modal">
          <span>&times;</span>
        </button>
      </div>
      <div class="modal-body">
        <div class="table-responsive">
          <table class="table table-striped table-hover table-bordered w-100" id="tblItemsCatalogo">
            <thead class="thead-dark">
              <tr>
                <th>Código</th>
                <th>Descripción</th>
                <th>Unidad</th>
                <th>Precio (Gs.)</th>
                <th>% IVA</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
      <div class="modal-footer">
        <small class="text-muted mr-auto">
          Los precios mostrados son referenciales y se pueden ajustar luego en la factura.
        </small>
        <button type="button" class="btn btn-secondary" data-dismiss="modal">Cerrar</button>
      </div>
    </div>
  </div>
</div>
