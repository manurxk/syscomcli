{% extends 'base.html' %}
    
{% block titulo %}
Notas de Débito
{% endblock %}

{% block contenido %}
<div class="container-fluid mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="mb-0">
            <i class="fas fa-file-invoice"></i> Notas de Débito
        </h3>
        <a href="{{ url_for('nota_debito.notaDebitoAgregar') }}" class="btn btn-primary">
            <i class="fas fa-plus"></i> Nueva Nota de Débito
        </a>
    </div>

    <!-- Tarjeta principal -->
    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h5 class="mb-0">Lista de Notas de Débito</h5>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-striped table-hover table-bordered w-100" id="tblNotasDebito">
                    <thead class="thead-dark">
                        <tr>
                            <th>Número</th>
                            <th>Fecha</th>
                            <th>Factura</th>
                            <th>Paciente</th>
                            <th>Motivo</th>
                            <th>Monto</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Modal Ver Detalle -->
<div class="modal fade" id="modalDetalle" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
            <div class="modal-header bg-info text-white">
                <h5 class="modal-title">Detalle de Nota de Débito</h5>
                <button type="button" class="close text-white" data-dismiss="modal">
                    <span>&times;</span>
                </button>
            </div>
            <div class="modal-body" id="detalleContenido">
                <!-- Contenido cargado dinámicamente -->
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">Cerrar</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block js %}
<script>
const CSRFToken = "{{ csrf_token() }}" || null;

// Inicializar DataTable
const initDatatable = () => {
    $('#tblNotasDebito').DataTable({
        language: {
            url: "{{ url_for('static', filename='vendor/datatables/es-ES.json') }}",
        },
        ajax: {
            url: '/api/v1/notas_debito',
            dataSrc: 'data'
        },
        columns: [
            { data: 'nota_debito_numero' },
            { data: 'fecha_nota_debito' },
            { data: 'factura_numero' },
            { data: 'paciente_nombre' },
            { 
                data: 'motivo_nota_debito',
                render: function(data) {
                    return data ? (data.length > 50 ? data.substring(0, 50) + '...' : data) : '-';
                }
            },
            { 
                data: 'monto_total',
                render: function(data) {
                    return formatearMoneda(data);
                }
            },
            { 
                data: 'est_nota_debito',
                render: function(data) {
                    const estados = {
                        'REGISTRADA': '<span class="badge badge-success">Registrada</span>',
                        'ANULADA': '<span class="badge badge-danger">Anulada</span>'
                    };
                    return estados[data] || data;
                }
            },
            { 
                data: function(row) {
                    return `
                        <button type="button" name="btn_ver" class="btn btn-info btn-sm" data-id="${row.id_nota_debito}" title="Ver detalle">
                            <i class="fas fa-eye"></i>
                        </button>
                        ${row.est_nota_debito === 'REGISTRADA' ? `
                            <button type="button" name="btn_anular" class="btn btn-danger btn-sm" data-id="${row.id_nota_debito}" title="Anular">
                                <i class="fas fa-ban"></i>
                            </button>
                        ` : ''}
                    `;
                }
            }
        ],
        order: [[1, 'desc']]
    });
}

// Formatear moneda
function formatearMoneda(valor) {
    return new Intl.NumberFormat('es-PY', {
        style: 'currency',
        currency: 'PYG',
        minimumFractionDigits: 0
    }).format(valor || 0);
}

// Ver detalle
const verDetalle = () => {
    $('#tblNotasDebito').on('click', 'button[name="btn_ver"]', function(){
        const idNota = $(this).data('id');
        
        Swal.fire({
            title: 'Cargando...',
            text: 'Obteniendo información',
            allowOutsideClick: false,
            didOpen: () => {
                Swal.showLoading();
            }
        });
        
        fetch(`/api/v1/notas_debito/${idNota}`, {
            method: 'GET',
            headers: { 'Content-Type': 'application/json' }
        })
        .then(resp => resp.json())
        .then(data => {
            Swal.close();
            if(data && data.success && data.data) {
                const nota = data.data;
                
                let detalleHtml = '';
                if(nota.detalle && nota.detalle.length > 0) {
                    detalleHtml = '<h6 class="mt-3">Detalle:</h6><table class="table table-sm table-bordered"><thead><tr><th>Descripción</th><th>Cantidad</th><th>Precio Unitario</th><th>Total</th></tr></thead><tbody>';
                    nota.detalle.forEach(det => {
                        detalleHtml += `<tr>
                            <td>${det.item_descripcion}</td>
                            <td>${det.item_cantidad}</td>
                            <td>${formatearMoneda(det.item_precio_unitario)}</td>
                            <td>${formatearMoneda(det.monto_total)}</td>
                        </tr>`;
                    });
                    detalleHtml += '</tbody></table>';
                }
                
                const contenido = `
                    <div class="row">
                        <div class="col-md-6">
                            <h6>Información General</h6>
                            <table class="table table-sm">
                                <tr><th>Número:</th><td>${nota.nota_debito_numero}</td></tr>
                                <tr><th>Fecha:</th><td>${nota.fecha_nota_debito}</td></tr>
                                <tr><th>Factura:</th><td>${nota.factura_numero}</td></tr>
                                <tr><th>Paciente:</th><td>${nota.paciente_nombre}</td></tr>
                                <tr><th>Tipo Comprobante:</th><td>${nota.tipo_comprobante}</td></tr>
                                <tr><th>Monto Total:</th><td><strong>${formatearMoneda(nota.monto_total)}</strong></td></tr>
                                <tr><th>Estado:</th><td><span class="badge badge-${nota.est_nota_debito === 'REGISTRADA' ? 'success' : 'danger'}">${nota.est_nota_debito}</span></td></tr>
                            </table>
                        </div>
                        <div class="col-md-6">
                            <h6>Motivo</h6>
                            <p>${nota.motivo_nota_debito}</p>
                            ${nota.observaciones ? `<h6>Observaciones</h6><p>${nota.observaciones}</p>` : ''}
                            ${nota.codigo_sifen ? `<p><strong>Código SIFEN:</strong> ${nota.codigo_sifen}</p>` : ''}
                            ${nota.numero_timbrado ? `<p><strong>Número Timbrado:</strong> ${nota.numero_timbrado}</p>` : ''}
                        </div>
                    </div>
                    ${detalleHtml}
                `;
                
                $('#detalleContenido').html(contenido);
                $('#modalDetalle').modal('show');
            } else {
                Swal.fire("Error", "No se pudo cargar la información.", "error");
            }
        })
        .catch(err => {
            Swal.close();
            console.error(err);
            Swal.fire("Error", "Ocurrió un error al cargar la información.", "error");
        });
    });
}

// Anular nota
const anularNota = () => {
    $('#tblNotasDebito').on('click', 'button[name="btn_anular"]', function(){
        const idNota = $(this).data('id');
        
        Swal.fire({
            title: '¿Anular Nota de Débito?',
            text: 'Esta acción no se puede deshacer. ¿Está seguro?',
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#d33',
            cancelButtonColor: '#3085d6',
            confirmButtonText: 'Sí, anular',
            cancelButtonText: 'Cancelar'
        }).then((result) => {
            if (result.isConfirmed) {
                Swal.fire({
                    title: 'Motivo de Anulación',
                    input: 'text',
                    inputLabel: 'Ingrese el motivo de la anulación',
                    inputPlaceholder: 'Motivo...',
                    showCancelButton: true,
                    confirmButtonText: 'Anular',
                    cancelButtonText: 'Cancelar',
                    inputValidator: (value) => {
                        if (!value) {
                            return 'Debe ingresar un motivo';
                        }
                    }
                }).then((result) => {
                    if (result.isConfirmed) {
                        fetch(`/api/v1/notas_debito/${idNota}/anular`, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'X-CSRFToken': CSRFToken
                            },
                            body: JSON.stringify({
                                motivo_anulacion: result.value
                            })
                        })
                        .then(resp => resp.json())
                        .then(data => {
                            if(data && data.success) {
                                Swal.fire({
                                    icon: 'success',
                                    title: 'Anulada',
                                    text: 'La nota de débito ha sido anulada exitosamente',
                                    timer: 2000,
                                    showConfirmButton: false
                                });
                                $('#tblNotasDebito').DataTable().ajax.reload();
                            } else {
                                Swal.fire("Error", data.error || "No se pudo anular la nota.", "error");
                            }
                        })
                        .catch(err => {
                            console.error(err);
                            Swal.fire("Error", "Ocurrió un error al anular.", "error");
                        });
                    }
                });
            }
        });
    });
}

// Inicializar cuando el documento esté listo
$(function() {
    initDatatable();
    verDetalle();
    anularNota();
});
</script>
{% endblock %}
