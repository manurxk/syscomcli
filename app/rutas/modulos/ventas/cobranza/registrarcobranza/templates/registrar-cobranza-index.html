{% extends 'base.html' %}
    
{% block titulo %}
Cobranzas
{% endblock %}

{% block contenido %}
<div class="container-fluid mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="mb-0">
            <i class="fas fa-cash-register"></i> Cobranzas
        </h3>
        <a href="{{ url_for('cobranza.cobranzaAgregar') }}" class="btn btn-primary">
            <i class="fas fa-plus"></i> Nueva Cobranza
        </a>
    </div>

    <!-- Tarjeta principal -->
    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h5 class="mb-0">Lista de Cobranzas</h5>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-striped table-hover table-bordered w-100" id="tblCobranzas">
                    <thead class="thead-dark">
                        <tr>
                            <th>Número</th>
                            <th>Fecha</th>
                            <th>Cuenta</th>
                            <th>Factura</th>
                            <th>Paciente</th>
                            <th>Forma de Pago</th>
                            <th>Monto</th>
                            <th>Caja</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Modal Ver Detalle -->
<div class="modal fade" id="modalDetalle" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
            <div class="modal-header bg-info text-white">
                <h5 class="modal-title">Detalle de Cobranza</h5>
                <button type="button" class="close text-white" data-dismiss="modal">
                    <span>&times;</span>
                </button>
            </div>
            <div class="modal-body" id="detalleContenido">
                <!-- Contenido cargado dinámicamente -->
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">Cerrar</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block js %}
<script>
const CSRFToken = "{{ csrf_token() }}" || null;

// Inicializar DataTable
const initDatatable = () => {
    $('#tblCobranzas').DataTable({
        language: {
            url: "{{ url_for('static', filename='vendor/datatables/es-ES.json') }}",
        },
        ajax: {
            url: '/api/v1/cobranzas',
            dataSrc: 'data'
        },
        columns: [
            { data: 'cobranza_numero' },
            { data: 'fecha_cobranza' },
            { data: 'cuenta_numero' },
            { data: 'factura_numero' },
            { data: 'paciente_nombre' },
            { data: 'forma_cobro' },
            { 
                data: 'monto_cobrado',
                render: function(data) {
                    return formatearMoneda(data);
                }
            },
            { data: 'caja' },
            { 
                data: 'est_cobranza',
                render: function(data) {
                    const estados = {
                        'REGISTRADA': '<span class="badge badge-success">Registrada</span>',
                        'ANULADA': '<span class="badge badge-danger">Anulada</span>'
                    };
                    return estados[data] || data;
                }
            },
            { 
                data: function(row) {
                    return `
                        <button type="button" name="btn_ver" class="btn btn-info btn-sm" data-id="${row.id_cobranza}" title="Ver detalle">
                            <i class="fas fa-eye"></i>
                        </button>
                        ${row.est_cobranza === 'REGISTRADA' ? `
                            <button type="button" name="btn_anular" class="btn btn-danger btn-sm" data-id="${row.id_cobranza}" title="Anular">
                                <i class="fas fa-ban"></i>
                            </button>
                        ` : ''}
                    `;
                }
            }
        ],
        order: [[1, 'desc']] // Ordenar por fecha descendente
    });
}

// Formatear moneda
function formatearMoneda(valor) {
    return new Intl.NumberFormat('es-PY', {
        style: 'currency',
        currency: 'PYG',
        minimumFractionDigits: 0
    }).format(valor || 0);
}

// Ver detalle de cobranza
const verDetalle = () => {
    $('#tblCobranzas').on('click', 'button[name="btn_ver"]', function(){
        const idCobranza = $(this).data('id');
        
        Swal.fire({
            title: 'Cargando...',
            text: 'Obteniendo información de la cobranza',
            allowOutsideClick: false,
            didOpen: () => {
                Swal.showLoading();
            }
        });
        
        fetch(`/api/v1/cobranzas/${idCobranza}`, {
            method: 'GET',
            headers: { 'Content-Type': 'application/json' }
        })
        .then(resp => resp.json())
        .then(data => {
            Swal.close();
            if(data && data.success && data.data) {
                const cobranza = data.data;
                let detalleHtml = '';
                
                if(cobranza.detalle && cobranza.detalle.length > 0) {
                    detalleHtml = '<h6 class="mt-3">Detalles de Formas de Pago:</h6><table class="table table-sm table-bordered"><thead><tr><th>Forma de Pago</th><th>Monto</th><th>Información Adicional</th></tr></thead><tbody>';
                    cobranza.detalle.forEach(det => {
                        let infoAdicional = '';
                        if (det.numero_cheque) infoAdicional += `Cheque: ${det.numero_cheque}<br>`;
                        if (det.numero_tarjeta) infoAdicional += `Tarjeta: ****${det.numero_tarjeta}<br>`;
                        if (det.marca_tarjeta) infoAdicional += `Marca: ${det.marca_tarjeta}<br>`;
                        if (det.numero_cuotas > 1) infoAdicional += `Cuotas: ${det.numero_cuotas}<br>`;
                        if (det.entidad_adherida) infoAdicional += `Entidad: ${det.entidad_adherida}<br>`;
                        if (det.entidad_emisora) infoAdicional += `Emisora: ${det.entidad_emisora}`;
                        
                        detalleHtml += `<tr>
                            <td>${det.forma_cobro}</td>
                            <td>${formatearMoneda(det.monto_cobrado)}</td>
                            <td>${infoAdicional || 'N/A'}</td>
                        </tr>`;
                    });
                    detalleHtml += '</tbody></table>';
                }
                
                const detalleContenido = `
                    <div class="row">
                        <div class="col-md-6">
                            <h6>Información de la Cobranza</h6>
                            <table class="table table-sm">
                                <tr><th>Número:</th><td>${cobranza.cobranza_numero}</td></tr>
                                <tr><th>Fecha:</th><td>${cobranza.fecha_cobranza}</td></tr>
                                <tr><th>Cuenta:</th><td>${cobranza.cuenta_numero}</td></tr>
                                <tr><th>Factura:</th><td>${cobranza.factura_numero}</td></tr>
                                <tr><th>Forma de Pago:</th><td>${cobranza.forma_cobro}</td></tr>
                                <tr><th>Monto:</th><td><strong>${formatearMoneda(cobranza.monto_cobrado)}</strong></td></tr>
                                <tr><th>Caja:</th><td>${cobranza.caja}</td></tr>
                                <tr><th>Estado:</th><td><span class="badge badge-${cobranza.est_cobranza === 'REGISTRADA' ? 'success' : 'danger'}">${cobranza.est_cobranza}</span></td></tr>
                            </table>
                        </div>
                        <div class="col-md-6">
                            <h6>Información del Paciente</h6>
                            <table class="table table-sm">
                                <tr><th>Nombre:</th><td>${cobranza.paciente_nombre}</td></tr>
                                <tr><th>CI:</th><td>${cobranza.paciente_cedula || 'N/A'}</td></tr>
                                <tr><th>Historia Clínica:</th><td>${cobranza.historia_clinica || 'N/A'}</td></tr>
                            </table>
                            <h6>Estado de la Cuenta</h6>
                            <table class="table table-sm">
                                <tr><th>Total:</th><td>${formatearMoneda(cobranza.monto_total_cuenta)}</td></tr>
                                <tr><th>Pagado:</th><td>${formatearMoneda(cobranza.monto_pagado_cuenta)}</td></tr>
                                <tr><th>Pendiente:</th><td><strong class="text-primary">${formatearMoneda(cobranza.monto_pendiente_cuenta)}</strong></td></tr>
                            </table>
                        </div>
                    </div>
                    ${detalleHtml}
                `;
                
                $('#detalleContenido').html(detalleContenido);
                $('#modalDetalle').modal('show');
            } else {
                Swal.fire("Error", "No se pudo cargar la cobranza.", "error");
            }
        })
        .catch(err => {
            Swal.close();
            console.error(err);
            Swal.fire("Error", "Ocurrió un error al cargar la cobranza.", "error");
        });
    });
}

// Anular cobranza
const anularCobranza = () => {
    $('#tblCobranzas').on('click', 'button[name="btn_anular"]', function(){
        const idCobranza = $(this).data('id');
        
        Swal.fire({
            title: '¿Anular Cobranza?',
            text: 'Esta acción revertirá el pago en la cuenta a cobrar. ¿Está seguro?',
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#d33',
            cancelButtonColor: '#3085d6',
            confirmButtonText: 'Sí, anular',
            cancelButtonText: 'Cancelar'
        }).then((result) => {
            if (result.isConfirmed) {
                Swal.fire({
                    title: 'Motivo de Anulación',
                    input: 'text',
                    inputLabel: 'Ingrese el motivo de la anulación',
                    inputPlaceholder: 'Motivo...',
                    showCancelButton: true,
                    confirmButtonText: 'Anular',
                    cancelButtonText: 'Cancelar',
                    inputValidator: (value) => {
                        if (!value) {
                            return 'Debe ingresar un motivo';
                        }
                    }
                }).then((result) => {
                    if (result.isConfirmed) {
                        fetch(`/api/v1/cobranzas/${idCobranza}/anular`, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'X-CSRFToken': CSRFToken
                            },
                            body: JSON.stringify({
                                motivo_anulacion: result.value
                            })
                        })
                        .then(resp => resp.json())
                        .then(data => {
                            if(data && data.success) {
                                Swal.fire({
                                    icon: 'success',
                                    title: 'Anulada',
                                    text: 'La cobranza ha sido anulada exitosamente',
                                    timer: 2000,
                                    showConfirmButton: false
                                });
                                $('#tblCobranzas').DataTable().ajax.reload();
                            } else {
                                Swal.fire("Error", data.error || "No se pudo anular la cobranza.", "error");
                            }
                        })
                        .catch(err => {
                            console.error(err);
                            Swal.fire("Error", "Ocurrió un error al anular.", "error");
                        });
                    }
                });
            }
        });
    });
}

// Inicializar cuando el documento esté listo
$(function() {
    initDatatable();
    verDetalle();
    anularCobranza();
});
</script>
{% endblock %}
