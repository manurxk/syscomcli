{% extends 'base.html' %}
    
{% block titulo %}
Arqueos de Caja
{% endblock %}

{% block contenido %}
<div class="container-fluid mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="mb-0">
            <i class="fas fa-calculator"></i> Arqueos de Caja
        </h3>
        <a href="{{ url_for('arqueo_caja.arqueoCajaAgregar') }}" class="btn btn-primary">
            <i class="fas fa-plus"></i> Nuevo Arqueo
        </a>
    </div>

    <!-- Filtros -->
    <div class="card shadow mb-4">
        <div class="card-body">
            <div class="row">
                <div class="col-md-3">
                    <div class="form-group">
                        <label for="filtroEstado">Filtrar por Estado:</label>
                        <select class="form-control" id="filtroEstado">
                            <option value="">Todos</option>
                            <option value="PENDIENTE">Pendiente</option>
                            <option value="CONCILIADO">Conciliado</option>
                            <option value="CON_DIFERENCIA">Con Diferencia</option>
                        </select>
                    </div>
                </div>
                <div class="col-md-9">
                    <div class="form-group">
                        <label>&nbsp;</label>
                        <div>
                            <button type="button" class="btn btn-primary" id="btnAplicarFiltros">
                                <i class="fas fa-filter"></i> Aplicar Filtros
                            </button>
                            <button type="button" class="btn btn-secondary" id="btnLimpiarFiltros">
                                <i class="fas fa-times"></i> Limpiar
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Tarjeta principal -->
    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h5 class="mb-0">Lista de Arqueos</h5>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-striped table-hover table-bordered w-100" id="tblArqueos">
                    <thead class="thead-dark">
                        <tr>
                            <th>Número</th>
                            <th>Fecha</th>
                            <th>Caja</th>
                            <th>Monto Esperado</th>
                            <th>Monto Real</th>
                            <th>Diferencia</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Modal Ver Detalle -->
<div class="modal fade" id="modalDetalle" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
            <div class="modal-header bg-info text-white">
                <h5 class="modal-title">Detalle de Arqueo</h5>
                <button type="button" class="close text-white" data-dismiss="modal">
                    <span>&times;</span>
                </button>
            </div>
            <div class="modal-body" id="detalleContenido">
                <!-- Contenido cargado dinámicamente -->
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">Cerrar</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block js %}
<script>
const CSRFToken = "{{ csrf_token() }}" || null;
let tablaArqueos = null;

// Inicializar DataTable
const initDatatable = () => {
    tablaArqueos = $('#tblArqueos').DataTable({
        language: {
            url: "{{ url_for('static', filename='vendor/datatables/es-ES.json') }}",
        },
        ajax: {
            url: '/api/v1/arqueos_caja',
            dataSrc: 'data'
        },
        columns: [
            { data: 'arqueo_numero' },
            { data: 'fecha_arqueo' },
            { data: 'caja' },
            { 
                data: 'monto_esperado',
                render: function(data) {
                    return formatearMoneda(data);
                }
            },
            { 
                data: 'monto_real',
                render: function(data) {
                    return formatearMoneda(data);
                }
            },
            { 
                data: 'diferencia',
                render: function(data) {
                    const clase = data === 0 ? 'text-success' : (Math.abs(data) > 1000 ? 'text-danger' : 'text-warning');
                    return `<span class="${clase} font-weight-bold">${formatearMoneda(data)}</span>`;
                }
            },
            { 
                data: 'est_arqueo',
                render: function(data) {
                    const estados = {
                        'PENDIENTE': '<span class="badge badge-warning">Pendiente</span>',
                        'CONCILIADO': '<span class="badge badge-success">Conciliado</span>',
                        'CON_DIFERENCIA': '<span class="badge badge-danger">Con Diferencia</span>'
                    };
                    return estados[data] || data;
                }
            },
            { 
                data: function(row) {
                    return `
                        <button type="button" name="btn_ver" class="btn btn-info btn-sm" data-id="${row.id_arqueo}" title="Ver detalle">
                            <i class="fas fa-eye"></i>
                        </button>
                        ${row.est_arqueo === 'CON_DIFERENCIA' ? `
                            <button type="button" name="btn_conciliar" class="btn btn-success btn-sm" data-id="${row.id_arqueo}" title="Conciliar">
                                <i class="fas fa-check"></i>
                            </button>
                        ` : ''}
                    `;
                }
            }
        ],
        order: [[1, 'desc']] // Ordenar por fecha descendente
    });
}

// Formatear moneda
function formatearMoneda(valor) {
    return new Intl.NumberFormat('es-PY', {
        style: 'currency',
        currency: 'PYG',
        minimumFractionDigits: 0
    }).format(valor || 0);
}

// Ver detalle
const verDetalle = () => {
    $('#tblArqueos').on('click', 'button[name="btn_ver"]', function(){
        const idArqueo = $(this).data('id');
        
        Swal.fire({
            title: 'Cargando...',
            text: 'Obteniendo información',
            allowOutsideClick: false,
            didOpen: () => {
                Swal.showLoading();
            }
        });
        
        fetch(`/api/v1/arqueos_caja/${idArqueo}`, {
            method: 'GET',
            headers: { 'Content-Type': 'application/json' }
        })
        .then(resp => resp.json())
        .then(data => {
            Swal.close();
            if(data && data.success && data.data) {
                const arqueo = data.data;
                
                const diferenciaClase = arqueo.diferencia === 0 ? 'text-success' : 
                                       (Math.abs(arqueo.diferencia) > 1000 ? 'text-danger' : 'text-warning');
                
                const detalleHtml = `
                    <div class="row">
                        <div class="col-md-6">
                            <h6>Información General</h6>
                            <table class="table table-sm">
                                <tr><th>Número:</th><td>${arqueo.arqueo_numero}</td></tr>
                                <tr><th>Fecha:</th><td>${arqueo.fecha_arqueo}</td></tr>
                                <tr><th>Caja:</th><td>${arqueo.caja}</td></tr>
                                <tr><th>Tipo Operación:</th><td><span class="badge badge-${arqueo.tipo_operacion === 'APERTURA' ? 'success' : 'info'}">${arqueo.tipo_operacion}</span></td></tr>
                                <tr><th>Fecha Apertura/Cierre:</th><td>${arqueo.fecha_apertura_cierre}</td></tr>
                                <tr><th>Estado:</th><td><span class="badge badge-${arqueo.est_arqueo === 'CONCILIADO' ? 'success' : (arqueo.est_arqueo === 'CON_DIFERENCIA' ? 'danger' : 'warning')}">${arqueo.est_arqueo}</span></td></tr>
                            </table>
                        </div>
                        <div class="col-md-6">
                            <h6>Montos</h6>
                            <table class="table table-sm">
                                <tr><th>Saldo Inicial:</th><td>${formatearMoneda(arqueo.saldo_inicial)}</td></tr>
                                ${arqueo.saldo_final ? `<tr><th>Saldo Final:</th><td>${formatearMoneda(arqueo.saldo_final)}</td></tr>` : ''}
                                <tr><th>Monto Esperado:</th><td><strong>${formatearMoneda(arqueo.monto_esperado)}</strong></td></tr>
                                <tr><th>Monto Real:</th><td><strong>${formatearMoneda(arqueo.monto_real)}</strong></td></tr>
                                <tr><th>Diferencia:</th><td><strong class="${diferenciaClase}">${formatearMoneda(arqueo.diferencia)}</strong></td></tr>
                            </table>
                            <h6>Desglose de Apertura/Cierre</h6>
                            <table class="table table-sm">
                                <tr><th>Efectivo:</th><td>${formatearMoneda(arqueo.monto_efectivo)}</td></tr>
                                <tr><th>Cheques:</th><td>${formatearMoneda(arqueo.monto_cheques)}</td></tr>
                                <tr><th>Tarjetas:</th><td>${formatearMoneda(arqueo.monto_tarjetas)}</td></tr>
                                <tr><th>Transferencias:</th><td>${formatearMoneda(arqueo.monto_transferencias)}</td></tr>
                            </table>
                        </div>
                    </div>
                    ${arqueo.observaciones ? `<div class="row"><div class="col-md-12"><h6>Observaciones:</h6><p>${arqueo.observaciones}</p></div></div>` : ''}
                `;
                
                $('#detalleContenido').html(detalleHtml);
                $('#modalDetalle').modal('show');
            } else {
                Swal.fire("Error", "No se pudo cargar la información.", "error");
            }
        })
        .catch(err => {
            Swal.close();
            console.error(err);
            Swal.fire("Error", "Ocurrió un error al cargar la información.", "error");
        });
    });
}

// Conciliar arqueo
const conciliarArqueo = () => {
    $('#tblArqueos').on('click', 'button[name="btn_conciliar"]', function(){
        const idArqueo = $(this).data('id');
        
        Swal.fire({
            title: '¿Conciliar Arqueo?',
            text: 'Esta acción marcará el arqueo como conciliado. ¿Está seguro?',
            icon: 'question',
            showCancelButton: true,
            confirmButtonColor: '#28a745',
            cancelButtonColor: '#6c757d',
            confirmButtonText: 'Sí, conciliar',
            cancelButtonText: 'Cancelar'
        }).then((result) => {
            if (result.isConfirmed) {
                Swal.fire({
                    title: 'Observaciones de Conciliación',
                    input: 'textarea',
                    inputLabel: 'Ingrese observaciones (opcional)',
                    inputPlaceholder: 'Observaciones...',
                    showCancelButton: true,
                    confirmButtonText: 'Conciliar',
                    cancelButtonText: 'Cancelar'
                }).then((result) => {
                    if (result.isConfirmed) {
                        fetch(`/api/v1/arqueos_caja/${idArqueo}/conciliar`, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'X-CSRFToken': CSRFToken
                            },
                            body: JSON.stringify({
                                observaciones: result.value || null
                            })
                        })
                        .then(resp => resp.json())
                        .then(data => {
                            if(data && data.success) {
                                Swal.fire({
                                    icon: 'success',
                                    title: 'Conciliado',
                                    text: 'El arqueo ha sido conciliado exitosamente',
                                    timer: 2000,
                                    showConfirmButton: false
                                });
                                tablaArqueos.ajax.reload();
                            } else {
                                Swal.fire("Error", data.error || "No se pudo conciliar el arqueo.", "error");
                            }
                        })
                        .catch(err => {
                            console.error(err);
                            Swal.fire("Error", "Ocurrió un error al conciliar.", "error");
                        });
                    }
                });
            }
        });
    });
}

// Aplicar filtros
$('#btnAplicarFiltros').on('click', function() {
    const estado = $('#filtroEstado').val();
    tablaArqueos.column(6).search(estado);
    tablaArqueos.draw();
});

// Limpiar filtros
$('#btnLimpiarFiltros').on('click', function() {
    $('#filtroEstado').val('');
    tablaArqueos.search('').columns().search('').draw();
});

// Inicializar cuando el documento esté listo
$(function() {
    initDatatable();
    verDetalle();
    conciliarArqueo();
});
</script>
{% endblock %}
