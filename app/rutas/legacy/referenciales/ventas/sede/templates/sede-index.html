{% extends 'base.html' %}

{% block titulo %}
Sedes
{% endblock %}


{% block contenido %}
<header class="page-header page-header-dark bg-gradient-primary-to-secondary pb-10">
  <div class="container-xl px-4">
    <div class="page-header-content pt-4">
      <div class="row align-items-center justify-content-between">
        <div class="col-auto mt-4">
          <h1 class="page-header-title">Gestión de Sedes</h1>
          <div class="page-header-subtitle">Administración de las diferentes sucursales y puntos de atención física
          </div>
        </div>
      </div>
    </div>
  </div>
</header>

<div class="container-xl px-4 mt-n10">
  <div class="card card-header-actions mb-4 shadow-sm">
    <div class="card-header">
      <span class="fw-semibold">Listado de Sedes</span>
      <a class="btn btn-sm btn-{{ ui.boton_agregar }} shadow-sm" href="{{ url_for('sede.sedeAgregar') }}">
        <i class="fas fa-plus fa-sm me-1"></i> Nueva Sede
      </a>
    </div>
    <div class="card-body">
      <div class="table-responsive">
        <table class="table table-hover table-bordered align-middle w-100" id="tbl">
          <thead class="table-light">
            <tr>
              <th>Empresa</th>
              <th>Nombre de Sede</th>
              <th>Ciudad</th>
              <th class="text-center" style="width: 110px;">Estado</th>
              <th class="text-center" style="width: 100px;">Acciones</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block js %}
<script>
  const CSRFToken = "{{ csrf_token() }}" || null;

  const initDatatable = () => {
    $('#tbl').DataTable({
      language: {
        url: "{{ url_for('static', filename='vendor/datatables/es-ES.json') }}",
      },
      ajax: '/api/v1/sedes',
      columns: [
        { data: 'empresa' },
        { data: 'descripcion' },
        { data: 'ciudad' },
        {
          data: 'estado', className: 'text-center',
          render: function (val) {
            return val
              ? '<span class="badge bg-{{ ui.color_badge_activo }}-soft text-{{ ui.color_badge_activo }}">Activo</span>'
              : '<span class="badge bg-{{ ui.color_badge_inactivo }}-soft text-{{ ui.color_badge_inactivo }}">Inactivo</span>';
          }
        },
        {
          className: 'text-center',
          data: function (row) {
            return `<button class="btn btn-datatable btn-icon btn-transparent-dark me-1" type="button" name="btn_editar" data-id="${row.id}" title="Editar"><i class="fas fa-edit"></i></button>
                    <button class="btn btn-datatable btn-icon btn-transparent-dark text-danger" type="button" name="btn_eliminar" data-id="${row.id}" title="Eliminar"><i class="fas fa-trash-alt"></i></button>`
          }
        }
      ]
    });
  }

  const editar = () => {
    $('#tbl').on('click', 'button[name="btn_editar"]', function () {
      const idSede = $(this).data('id');
      window.location.href = "{{ url_for('sede.sedeAgregar') }}?id=" + idSede;
    });
  }

  const eliminar = () => {
    $('#tbl').on('click', 'button[name="btn_eliminar"]', function () {
      const idSede = $(this).data('id');

      Swal.fire({
        title: "¿Deseas eliminar este registro?",
        text: "Esta acción no se puede deshacer.",
        icon: "warning",
        showCancelButton: true,
        confirmButtonText: "Sí, eliminar",
        cancelButtonText: "Cancelar",
        confirmButtonColor: "#e74a3b"
      }).then((result) => {
        if (result.isConfirmed) {
          fetch(`/api/v1/sedes/${idSede}`, {
            method: 'DELETE',
            headers: {
              'Content-Type': 'application/json',
              'X-CSRFToken': CSRFToken
            }
          })
            .then(resp => resp.json())
            .then(data => {
              if (data && !data.error && data.success) {
                const tabla = $('#tbl').DataTable();
                tabla.ajax.reload();
                Swal.fire("Eliminado", "La sede ha sido eliminada.", "success");
              } else {
                Swal.fire("Error", data.error || "No se pudo eliminar la sede.", "error");
              }
            })
            .catch(() => Swal.fire("Error", "Error de red.", "error"));
        }
      });
    });
  }

  $(function () {
    initDatatable();
    editar();
    eliminar();
  });
</script>
{% endblock %}
