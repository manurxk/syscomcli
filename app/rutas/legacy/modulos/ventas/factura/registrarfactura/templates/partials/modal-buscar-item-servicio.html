<!-- Modal Buscar Item/Servicio (estilo uniforme con Buscar Paciente) -->
<div class="modal fade" id="modalBuscarItemServicio" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content border-0 shadow">
      <div class="modal-header border-bottom">
        <h5 class="modal-title fw-bold">Buscar Item / Servicio</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body p-4">
        <div class="table-responsive">
          <table class="table table-hover table-bordered align-middle w-100" id="tblItemsCatalogo">
            <thead class="table-light">
              <tr>
                <th>Código</th>
                <th>Descripción</th>
                <th>Unidad</th>
                <th>Precio (Gs.)</th>
                <th>% IVA</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
      <div class="modal-footer bg-light border-top">
        <small class="text-muted me-auto">
          Los precios mostrados son referenciales y se pueden ajustar luego en la factura.
        </small>
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
      </div>
    </div>
  </div>
</div>
