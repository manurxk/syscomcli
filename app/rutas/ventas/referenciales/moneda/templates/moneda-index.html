{% extends 'base.html' %}
{% block titulo %}Monedas{% endblock %}
{% block contenido %}
<header class="page-header page-header-dark bg-gradient-primary-to-secondary pb-10">
  <div class="container-fluid px-4">
    <div class="page-header-content pt-4">
      <div class="row align-items-center justify-content-between">
        <div class="col-auto mt-4">
          <h1 class="page-header-title">Gestión de Monedas</h1>
          <div class="page-header-subtitle">Monedas disponibles para operaciones de venta</div>
        </div>
        <div class="col-auto mt-4">
          <a class="btn btn-outline-light btn-sm" href="{{ url_for('referenciales.referencialesIndex') }}">Volver al Listado</a>
        </div>
      </div>
    </div>
  </div>
</header>
<div class="container-fluid px-4 mt-n10">
  <div class="card shadow-sm mb-4">
    <div class="card-header py-3 d-flex align-items-center">
      <h6 class="m-0 fw-bold">Listado de Monedas</h6>
      <button type="button" class="btn btn-sm btn-primary ms-auto" id="btnAgregar">Agregar</button>
    </div>
    <div class="card-body">
      <div class="table-responsive">
        <table class="table table-hover table-bordered align-middle w-100" id="tbl">
          <thead class="table-light">
            <tr>
              <th>#</th><th>Descripción</th><th>Código</th><th>Símbolo</th>
              <th>Local</th><th>Tasa</th><th>Estado</th><th>Acciones</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>
</div>
<div class="modal fade" id="modalFormulario" tabindex="-1" data-bs-backdrop="static">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow">
      <div class="modal-header border-bottom">
        <h5 class="modal-title fw-bold" id="modalTitle">Nueva Moneda</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="txtId">
        <div class="row g-3">
          <div class="col-12">
            <label class="fw-semibold">Descripción <span class="text-danger">*</span></label>
            <input type="text" class="form-control" id="txtDescripcion" placeholder="Ej. GUARANI PARAGUAYO">
          </div>
          <div class="col-6">
            <label class="fw-semibold">Código <span class="text-danger">*</span></label>
            <input type="text" class="form-control" id="txtCodigo" placeholder="PYG" maxlength="10">
          </div>
          <div class="col-6">
            <label class="fw-semibold">Símbolo</label>
            <input type="text" class="form-control" id="txtSimbolo" placeholder="Gs." maxlength="10">
          </div>
          <div class="col-6">
            <label class="fw-semibold">Decimales</label>
            <input type="number" class="form-control" id="txtDecimales" value="0" min="0" max="6">
          </div>
          <div class="col-6">
            <label class="fw-semibold">Tasa de cambio</label>
            <input type="number" class="form-control" id="txtTasa" value="1" min="0" step="0.000001">
          </div>
          <div class="col-6">
            <div class="form-check form-switch mt-3">
              <input class="form-check-input" type="checkbox" id="chkLocal">
              <label class="form-check-label fw-semibold" for="chkLocal">Moneda local</label>
            </div>
          </div>
          <div class="col-6">
            <div class="form-check form-switch mt-3">
              <input class="form-check-input" type="checkbox" id="chkEstado" checked>
              <label class="form-check-label fw-semibold" for="chkEstado">Activo</label>
            </div>
          </div>
        </div>
      </div>
      <div class="modal-footer bg-light">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-primary" id="btnGuardar"><i data-feather="save" class="icon-sm"></i> Guardar</button>
      </div>
    </div>
  </div>
</div>
{% endblock %}
{% block js %}
<script>
  const CSRFToken = "{{ csrf_token() }}";
  const initDatatable = () => {
    $('#tbl').DataTable({
      language: { url: "{{ url_for('static', filename='vendor/datatables/es-ES.json') }}" },
      ajax: { url: '/api/v1/monedas', dataSrc: 'data' },
      columns: [
        { data: null, orderable: false, render: (d,t,r,m) => m.row+1 },
        { data: 'des_moneda' },
        { data: 'cod_moneda' },
        { data: row => row.simbolo_moneda || '-' },
        { data: row => row.es_moneda_local ? '<span class="badge bg-info">Sí</span>' : '<span class="badge bg-secondary">No</span>', className: 'text-center' },
        { data: row => parseFloat(row.tasa_cambio || 1).toFixed(4) },
        { data: row => row.est_moneda ? '<span class="badge rounded-pill border border-success text-success">Activo</span>' : '<span class="badge rounded-pill border border-secondary text-secondary">Inactivo</span>', className: 'text-center' },
        { data: row => `<button class="btn btn-sm btn-outline-primary" name="btn_editar" data-id="${row.id_moneda}">Editar</button>`, className: 'text-center', orderable: false }
      ],
      order: [[1,'asc']]
    });
  };
  const agregar = () => {
    $('#btnAgregar').on('click', () => {
      $('#modalTitle').text('Nueva Moneda'); $('#txtId').val('');
      $('#txtDescripcion,#txtCodigo,#txtSimbolo').val('');
      $('#txtDecimales').val(0); $('#txtTasa').val(1);
      $('#chkLocal,#chkEstado').prop('checked', false);
      $('#chkEstado').prop('checked', true);
      new bootstrap.Modal(document.getElementById('modalFormulario')).show();
    });
  };
  const guardar = () => {
    $('#btnGuardar').on('click', () => {
      const id = $('#txtId').val();
      const desc = $('#txtDescripcion').val().trim();
      const cod = $('#txtCodigo').val().trim();
      if (!desc || !cod) { Swal.fire('Atención','Descripción y código son obligatorios.','warning'); return; }
      const payload = {
        des_moneda: desc, cod_moneda: cod, simbolo_moneda: $('#txtSimbolo').val().trim() || null,
        decimales_moneda: parseInt($('#txtDecimales').val()||0),
        tasa_cambio: parseFloat($('#txtTasa').val()||1),
        es_moneda_local: $('#chkLocal').is(':checked'),
        est_moneda: $('#chkEstado').is(':checked')
      };
      fetch(id ? `/api/v1/monedas/${id}` : '/api/v1/monedas', {
        method: id ? 'PUT' : 'POST',
        headers: { 'Content-Type': 'application/json', 'X-CSRFToken': CSRFToken },
        body: JSON.stringify(payload)
      }).then(r=>r.json()).then(d => {
        if (d.success) { $('#tbl').DataTable().ajax.reload(); bootstrap.Modal.getInstance(document.getElementById('modalFormulario')).hide(); Swal.fire('Éxito', id ? 'Moneda actualizada.' : 'Moneda agregada.','success'); }
        else Swal.fire('Error', d.error||'No se pudo guardar.','error');
      }).catch(() => Swal.fire('Error','Error al guardar.','error'));
    });
  };
  const editar = () => {
    $('#tbl tbody').on('click','button[name="btn_editar"]', function() {
      const id = $(this).data('id');
      fetch(`/api/v1/monedas/${id}`).then(r=>r.json()).then(d => {
        if (!d.success) { Swal.fire('Error',d.error,'error'); return; }
        const m = d.data;
        $('#modalTitle').text('Editar Moneda'); $('#txtId').val(m.id_moneda);
        $('#txtDescripcion').val(m.des_moneda); $('#txtCodigo').val(m.cod_moneda);
        $('#txtSimbolo').val(m.simbolo_moneda||''); $('#txtDecimales').val(m.decimales_moneda||0);
        $('#txtTasa').val(m.tasa_cambio||1);
        $('#chkLocal').prop('checked', m.es_moneda_local);
        $('#chkEstado').prop('checked', m.est_moneda);
        new bootstrap.Modal(document.getElementById('modalFormulario')).show();
      });
    });
  };
  $(function() { initDatatable(); agregar(); guardar(); editar(); });
</script>
{% endblock %}
