{% extends 'base.html' %}
{% block titulo %}Cajas{% endblock %}
{% block contenido %}
<header class="page-header page-header-dark bg-gradient-primary-to-secondary pb-10">
  <div class="container-fluid px-4">
    <div class="page-header-content pt-4">
      <div class="row align-items-center justify-content-between">
        <div class="col-auto mt-4">
          <h1 class="page-header-title">Cajas</h1>
          <div class="page-header-subtitle">Puntos de venta y cajas registradoras</div>
        </div>
        <div class="col-auto mt-4">
          <a class="btn btn-outline-light btn-sm" href="{{ url_for('referenciales.referencialesIndex') }}">Volver al Listado</a>
        </div>
      </div>
    </div>
  </div>
</header>
<div class="container-fluid px-4 mt-n10">
  <div class="card shadow-sm mb-4">
    <div class="card-header py-3 d-flex align-items-center">
      <h6 class="m-0 fw-bold">Listado de Cajas</h6>
      <button type="button" class="btn btn-sm btn-primary ms-auto" id="btnAgregar">Agregar</button>
    </div>
    <div class="card-body">
      <div class="table-responsive">
        <table class="table table-hover table-bordered align-middle w-100" id="tbl">
          <thead class="table-light">
            <tr><th>#</th><th>Descripción</th><th>Código</th><th>Saldo inicial</th><th>Estado caja</th><th>Activo</th><th>Acciones</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>
</div>
<div class="modal fade" id="modalFormulario" tabindex="-1" data-bs-backdrop="static">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow">
      <div class="modal-header border-bottom">
        <h5 class="modal-title fw-bold" id="modalTitle">Nueva Caja</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="txtId">
        <div class="row g-3">
          <div class="col-12">
            <label class="fw-semibold">Descripción <span class="text-danger">*</span></label>
            <input type="text" class="form-control" id="txtDescripcion" placeholder="Ej. CAJA PRINCIPAL">
          </div>
          <div class="col-6">
            <label class="fw-semibold">Código</label>
            <input type="text" class="form-control" id="txtCodigo" placeholder="CAJA01" maxlength="20">
          </div>
          <div class="col-6">
            <label class="fw-semibold">Saldo inicial</label>
            <input type="number" class="form-control" id="txtSaldo" value="0" min="0" step="1000">
          </div>
          <div class="col-12">
            <label class="fw-semibold">Estado de caja</label>
            <select class="form-select" id="selEstadoCaja">
              <option value="CERRADA">CERRADA</option>
              <option value="ABIERTA">ABIERTA</option>
            </select>
          </div>
          <div class="col-12">
            <div class="form-check form-switch">
              <input class="form-check-input" type="checkbox" id="chkEstado" checked>
              <label class="form-check-label fw-semibold" for="chkEstado">Activo</label>
            </div>
          </div>
        </div>
      </div>
      <div class="modal-footer bg-light">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-primary" id="btnGuardar"><i data-feather="save" class="icon-sm"></i> Guardar</button>
      </div>
    </div>
  </div>
</div>
{% endblock %}
{% block js %}
<script>
  const CSRFToken = "{{ csrf_token() }}";
  const initDatatable = () => {
    $('#tbl').DataTable({
      language: { url: "{{ url_for('static', filename='vendor/datatables/es-ES.json') }}" },
      ajax: { url: '/api/v1/cajas', dataSrc: 'data' },
      columns: [
        { data: null, orderable: false, render: (d,t,r,m) => m.row+1 },
        { data: 'des_caja' },
        { data: row => row.cod_caja || '-' },
        { data: row => parseFloat(row.caja_saldo_inicial || 0).toLocaleString('es-PY') },
        { data: row => {
            const s = row.caja_estado || 'CERRADA';
            const cls = s === 'ABIERTA' ? 'bg-success' : 'bg-secondary';
            return `<span class="badge ${cls}">${s}</span>`;
          }, className: 'text-center' },
        { data: row => row.est_caja ? '<span class="badge rounded-pill border border-success text-success">Activo</span>' : '<span class="badge rounded-pill border border-secondary text-secondary">Inactivo</span>', className: 'text-center' },
        { data: row => `<button class="btn btn-sm btn-outline-primary" name="btn_editar" data-id="${row.id_caja}">Editar</button>`, className: 'text-center', orderable: false }
      ],
      order: [[1,'asc']]
    });
  };
  const agregar = () => {
    $('#btnAgregar').on('click', () => {
      $('#modalTitle').text('Nueva Caja'); $('#txtId').val('');
      $('#txtDescripcion,#txtCodigo').val(''); $('#txtSaldo').val(0);
      $('#selEstadoCaja').val('CERRADA'); $('#chkEstado').prop('checked', true);
      new bootstrap.Modal(document.getElementById('modalFormulario')).show();
    });
  };
  const guardar = () => {
    $('#btnGuardar').on('click', () => {
      const id = $('#txtId').val();
      const desc = $('#txtDescripcion').val().trim();
      if (!desc) { Swal.fire('Atención','La descripción es obligatoria.','warning'); return; }
      const payload = {
        des_caja: desc,
        cod_caja: $('#txtCodigo').val().trim() || null,
        caja_saldo_inicial: parseFloat($('#txtSaldo').val()||0),
        caja_estado: $('#selEstadoCaja').val(),
        est_caja: $('#chkEstado').is(':checked')
      };
      fetch(id ? `/api/v1/cajas/${id}` : '/api/v1/cajas', {
        method: id ? 'PUT' : 'POST',
        headers: { 'Content-Type': 'application/json', 'X-CSRFToken': CSRFToken },
        body: JSON.stringify(payload)
      }).then(r=>r.json()).then(d => {
        if (d.success) { $('#tbl').DataTable().ajax.reload(); bootstrap.Modal.getInstance(document.getElementById('modalFormulario')).hide(); Swal.fire('Éxito', id ? 'Caja actualizada.' : 'Caja agregada.','success'); }
        else Swal.fire('Error', d.error||'No se pudo guardar.','error');
      }).catch(() => Swal.fire('Error','Error al guardar.','error'));
    });
  };
  const editar = () => {
    $('#tbl tbody').on('click','button[name="btn_editar"]', function() {
      const id = $(this).data('id');
      fetch(`/api/v1/cajas/${id}`).then(r=>r.json()).then(d => {
        if (!d.success) { Swal.fire('Error',d.error,'error'); return; }
        const m = d.data;
        $('#modalTitle').text('Editar Caja'); $('#txtId').val(m.id_caja);
        $('#txtDescripcion').val(m.des_caja); $('#txtCodigo').val(m.cod_caja||'');
        $('#txtSaldo').val(m.caja_saldo_inicial||0); $('#selEstadoCaja').val(m.caja_estado||'CERRADA');
        $('#chkEstado').prop('checked', m.est_caja);
        new bootstrap.Modal(document.getElementById('modalFormulario')).show();
      });
    });
  };
  $(function() { initDatatable(); agregar(); guardar(); editar(); });
</script>
{% endblock %}
