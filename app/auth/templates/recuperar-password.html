<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="Recuperar contraseña - Sistema SYSCLIN">
    <link rel="shortcut icon" href="{{ url_for('static', filename='img/sys_logo.png') }}">
    <title>Recuperar contraseña - SYSCLIN</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,300&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --blue: #5b21b6;
            --purple: #9333ea;
            --gradient: linear-gradient(135deg, #5b21b6 0%, #9333ea 100%);
            --dark: #1e293b;
            --muted: #64748b;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(45deg, #0d0a1a, #1e1033, #4c1d95, #0d0a1a);
        }

        .card {
            width: 400px;
            max-width: 92vw;
            background: white;
            border-radius: 1.4rem;
            padding: 2.6rem 2.4rem;
            box-shadow: 0 60px 90px -20px rgba(0, 0, 0, 0.6);
        }

        @media (max-width: 480px) {
            .card {
                padding: 1.8rem 1.4rem;
                border-radius: 1rem;
            }
        }

        .eyebrow {
            font-size: 0.68rem;
            font-weight: 700;
            color: var(--purple);
            text-transform: uppercase;
            letter-spacing: 2.5px;
            margin-bottom: 0.45rem;
        }

        h2 { font-size: 1.4rem; font-weight: 800; color: var(--dark); }

        p.subtitle { font-size: 0.85rem; color: var(--muted); margin-top: 0.4rem; margin-bottom: 1.6rem; }

        .field { margin-bottom: 1.2rem; }

        .field label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--muted);
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-bottom: 0.4rem;
        }

        .field input {
            width: 100%;
            padding: 0.85rem 1rem;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 600;
            color: var(--dark);
            background: #f1f5ff;
            border: 1.5px solid transparent;
            border-radius: 0.85rem;
            outline: none;
        }

        .field input:focus {
            background: #fff;
            border-color: var(--purple);
            box-shadow: 0 0 0 4px rgba(115, 103, 240, 0.1);
        }

        .btn {
            width: 100%;
            padding: 0.9rem;
            background: var(--gradient);
            color: white;
            font-family: inherit;
            font-size: 0.88rem;
            font-weight: 700;
            border: none;
            border-radius: 0.85rem;
            cursor: pointer;
        }

        .btn:disabled { opacity: 0.6; cursor: default; }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 1.2rem;
            font-size: 0.8rem;
            color: var(--muted);
            text-decoration: none;
        }

        .flash {
            padding: 0.75rem 1rem;
            border-radius: 0.75rem;
            font-size: 0.83rem;
            margin-bottom: 1.25rem;
            display: none;
        }

        .flash-danger { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
        .flash-primary { background: #eef2ff; color: #4f46e5; border: 1px solid #c7d2fe; }
    </style>
</head>

<body>
    <div class="card">
        <div class="eyebrow">Acceso</div>
        <h2>Recuperar contraseña</h2>
        <p class="subtitle">Ingrese su usuario y el correo vinculado a su cuenta. Si coinciden, le enviaremos un enlace para restablecer su contraseña.</p>

        <div class="flash flash-danger" id="flashError"></div>
        <div class="flash flash-primary" id="flashOk"></div>

        <form id="formRecuperar">
            <div class="field">
                <label for="usuario">Usuario</label>
                <input type="text" id="usuario" name="usuario" placeholder="usuario" required autofocus>
            </div>
            <div class="field">
                <label for="correo">Correo vinculado a su cuenta</label>
                <input type="email" id="correo" name="correo" placeholder="nombre@correo.com" required>
            </div>
            <button type="submit" class="btn" id="btnEnviar">Enviar enlace</button>
        </form>
        <a href="{{ url_for('login.login') }}" class="back-link">Volver al login</a>
    </div>

    <script>
        const CSRFToken = "{{ csrf_token() }}";
        const form = document.getElementById('formRecuperar');
        const btn = document.getElementById('btnEnviar');
        const flashError = document.getElementById('flashError');
        const flashOk = document.getElementById('flashOk');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            flashError.style.display = 'none';
            flashOk.style.display = 'none';
            btn.disabled = true;
            btn.textContent = 'Enviando...';

            const body = {
                username: document.getElementById('usuario').value.trim(),
                email: document.getElementById('correo').value.trim()
            };

            try {
                const resp = await fetch('/api/v1/auth/recuperar-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-CSRFToken': CSRFToken },
                    body: JSON.stringify(body)
                });
                const data = await resp.json();
                if (data.success) {
                    flashOk.textContent = data.message;
                    flashOk.style.display = 'block';
                    form.reset();
                } else {
                    flashError.textContent = data.error || 'No se pudo procesar la solicitud.';
                    flashError.style.display = 'block';
                }
            } catch (err) {
                flashError.textContent = 'Error de conexión. Intente nuevamente.';
                flashError.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Enviar enlace';
            }
        });
    </script>
</body>

</html>
