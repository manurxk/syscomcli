<!DOCTYPE html>
<html lang="es" data-bs-theme="light">
<!--
    Prototipo estático del login — enfoque clínico sobrio — SYSCLIN
    Se abre con doble clic, no necesita Flask.

    Criterio:
    - Bootstrap 5.3.7 (la misma versión que base.html) y sus componentes: card, form-control,
      input-group, btn, alert, form-text. Sin sistema de diseño propio.
    - Fuente Nunito (la del sistema, base.html).
    - Modo oscuro nativo de Bootstrap con data-bs-theme y la clave 'lte-theme' de base.html.
    - Base neutra; el color de marca solo en el botón principal y los enlaces.
    - Sin degradados, sin textos de marketing, sin íconos decorativos.

    Para simular el error de login, ingresá cualquier contraseña distinta de "demo".
    Precedente anterior (estilo SaaS): prototipos/login.html
-->
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - SYSCLIN</title>
    <link rel="shortcut icon" href="../app/static/img/sys_logo.png">

    <!-- Tema antes de pintar (misma clave que base.html) -->
    <script>
        (function () {
            var stored = null;
            try { stored = localStorage.getItem('lte-theme'); } catch (e) {}
            var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            document.documentElement.setAttribute('data-bs-theme',
                stored === 'dark' || (!stored && prefersDark) ? 'dark' : 'light');
        })();
    </script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        /* Solo se ajustan variables de Bootstrap: fuente y color primario del sistema */
        :root,
        [data-bs-theme="light"] {
            --bs-body-font-family: 'Nunito', sans-serif;
            --bs-primary: #5b21b6;
            --bs-primary-rgb: 91, 33, 182;
            --bs-link-color: #5b21b6;
            --bs-link-color-rgb: 91, 33, 182;
            --bs-link-hover-color: #4c1d95;
            --bs-link-hover-color-rgb: 76, 29, 149;
        }

        [data-bs-theme="dark"] {
            --bs-body-font-family: 'Nunito', sans-serif;
            --bs-primary: #5b21b6;
            --bs-primary-rgb: 91, 33, 182;
            --bs-link-color: #a78bfa;
            --bs-link-color-rgb: 167, 139, 250;
            --bs-link-hover-color: #c4b5fd;
            --bs-link-hover-color-rgb: 196, 181, 253;
        }

        .btn-primary {
            --bs-btn-bg: #5b21b6;
            --bs-btn-border-color: #5b21b6;
            --bs-btn-hover-bg: #4c1d95;
            --bs-btn-hover-border-color: #4c1d95;
            --bs-btn-active-bg: #4c1d95;
            --bs-btn-active-border-color: #4c1d95;
            --bs-btn-disabled-bg: #5b21b6;
            --bs-btn-disabled-border-color: #5b21b6;
            --bs-btn-focus-shadow-rgb: 91, 33, 182;
        }

        .form-control:focus {
            border-color: #8b5cf6;
            box-shadow: 0 0 0 0.25rem rgba(91, 33, 182, 0.2);
        }

        .login-wrap {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        .login-box {
            width: 100%;
            max-width: 400px;
        }

        .login-logo {
            width: 44px;
            height: 44px;
            object-fit: contain;
        }

        .btn-eye {
            border-color: var(--bs-border-color);
            color: var(--bs-secondary-color);
        }

        .btn-eye:hover,
        .btn-eye:focus-visible {
            color: var(--bs-body-color);
            background: var(--bs-tertiary-bg);
        }

        .icon {
            width: 16px;
            height: 16px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            vertical-align: -0.15em;
        }

        .theme-sun { display: none; }
        [data-bs-theme="dark"] .theme-sun { display: inline; }
        [data-bs-theme="dark"] .theme-moon { display: none; }
    </style>
</head>

<body class="bg-body-tertiary">
    <div class="login-wrap">
        <div class="login-box">

            <!-- Identidad -->
            <div class="text-center mb-4">
                <img src="../app/static/img/sys_logo.png" alt="" class="login-logo mb-2">
                <h1 class="h4 fw-bold mb-0">SYSCLIN</h1>
                <div class="small text-body-secondary">Sistema de Gestión Clínica</div>
            </div>

            <!-- Formulario -->
            <div class="card border shadow-sm">
                <div class="card-body p-4">
                    <h2 class="h5 fw-bold mb-1">Iniciar sesión</h2>
                    <p class="small text-body-secondary mb-4">Ingresá tus credenciales para continuar.</p>

                    <!-- Equivale a los mensajes flash 'danger' -->
                    <div class="alert alert-danger small py-2" id="alertError" role="alert" hidden>
                        Usuario o contraseña incorrectos.
                    </div>

                    <form id="loginForm" method="POST" action="#" novalidate>
                        <div class="mb-3">
                            <label class="form-label small fw-semibold" for="inputUsuario">Usuario</label>
                            <input type="text" class="form-control" id="inputUsuario" name="usuario_nombre"
                                required autocomplete="username" autocapitalize="none" spellcheck="false" autofocus>
                            <div class="invalid-feedback">Ingresá tu usuario.</div>
                        </div>

                        <div class="mb-3">
                            <div class="d-flex justify-content-between align-items-baseline">
                                <label class="form-label small fw-semibold" for="usuario_clave">Contraseña</label>
                                <a href="#" class="small">¿Olvidaste tu contraseña?</a>
                            </div>
                            <div class="input-group has-validation">
                                <input type="password" class="form-control" id="usuario_clave" name="usuario_clave"
                                    required autocomplete="current-password">
                                <button type="button" class="btn btn-eye" id="togglePassword"
                                    aria-label="Mostrar contraseña" aria-pressed="false">
                                    <svg class="icon" id="eyeIcon" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                                </button>
                                <div class="invalid-feedback">Ingresá tu contraseña.</div>
                            </div>
                            <div class="form-text text-warning-emphasis" id="capsHint" hidden>Bloq Mayús está activado.</div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 fw-semibold" id="btnLogin">
                            <span class="spinner-border spinner-border-sm me-2" id="btnSpinner" aria-hidden="true" hidden></span>
                            <span id="btnText">Ingresar</span>
                        </button>
                    </form>
                </div>
            </div>

            <!-- Pie: idioma, tema, versión -->
            <div class="d-flex align-items-center justify-content-between mt-3">
                <div class="btn-group btn-group-sm" role="group" aria-label="Idioma">
                    <a href="#" class="btn btn-outline-secondary active" aria-current="true" lang="es">ES</a>
                    <a href="#" class="btn btn-outline-secondary" lang="gn">GN</a>
                    <a href="#" class="btn btn-outline-secondary" lang="en">EN</a>
                </div>
                <button type="button" class="btn btn-sm btn-outline-secondary" id="themeToggle" title="Cambiar tema" aria-label="Cambiar tema">
                    <svg class="icon theme-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                    <svg class="icon theme-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
                </button>
            </div>

            <p class="text-center small text-body-secondary mt-4 mb-0">
                &copy; 2026 SYSCLIN · Versión 2.0.4
            </p>
        </div>
    </div>

    <script>
        const pw = document.getElementById('usuario_clave');
        const user = document.getElementById('inputUsuario');
        const toggle = document.getElementById('togglePassword');
        const eye = document.getElementById('eyeIcon');
        const capsHint = document.getElementById('capsHint');
        const alertError = document.getElementById('alertError');
        const btn = document.getElementById('btnLogin');
        const btnText = document.getElementById('btnText');
        const btnSpinner = document.getElementById('btnSpinner');

        const svgOpen = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
        const svgOff = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';

        // Mostrar / ocultar contraseña
        toggle.addEventListener('click', () => {
            const show = pw.type === 'password';
            pw.type = show ? 'text' : 'password';
            eye.innerHTML = show ? svgOff : svgOpen;
            toggle.setAttribute('aria-pressed', String(show));
            toggle.setAttribute('aria-label', show ? 'Ocultar contraseña' : 'Mostrar contraseña');
            pw.focus();
        });

        // Aviso de Bloq Mayús
        ['keydown', 'keyup'].forEach((ev) => {
            pw.addEventListener(ev, (e) => {
                if (e.getModifierState) capsHint.hidden = !e.getModifierState('CapsLock');
            });
        });
        pw.addEventListener('blur', () => { capsHint.hidden = true; });

        // Validación con las clases de Bootstrap (is-invalid / invalid-feedback)
        [user, pw].forEach((input) => {
            input.addEventListener('input', () => input.classList.remove('is-invalid'));
        });

        // Envío simulado (prototipo): contraseña "demo" = OK, cualquier otra = error
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            alertError.hidden = true;

            let valido = true;
            [user, pw].forEach((input) => {
                const vacio = !input.value.trim();
                input.classList.toggle('is-invalid', vacio);
                if (vacio && valido) { input.focus(); valido = false; }
            });
            if (!valido) return;

            btn.disabled = true;
            btnSpinner.hidden = false;
            btnText.textContent = 'Ingresando…';

            setTimeout(() => {
                btn.disabled = false;
                btnSpinner.hidden = true;
                btnText.textContent = 'Ingresar';
                if (pw.value !== 'demo') {
                    alertError.hidden = false;
                    pw.value = '';
                    pw.focus();
                }
            }, 800);
        });

        // Tema claro/oscuro — misma clave y atributo que base.html
        document.getElementById('themeToggle').addEventListener('click', () => {
            const theme = document.documentElement.getAttribute('data-bs-theme') === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-bs-theme', theme);
            try { localStorage.setItem('lte-theme', theme); } catch (e) {}
        });

        // Prototipo: los enlaces no navegan
        document.querySelectorAll('a[href="#"]').forEach((a) => a.addEventListener('click', (e) => e.preventDefault()));
    </script>
</body>

</html>
