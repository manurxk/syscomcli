# Proxy HTTPS de Sysclin (PDF 8 - Seguridad).
# nginx termina TLS y reenvia a la app por la red interna (app:5000).
# Mismo archivo en desarrollo y en el servidor: solo cambian los certificados
# (autofirmado en local, Let's Encrypt en el servidor) y el HSTS (snippets/, solo servidor).

server_tokens off;

# HTTP: solo la validacion de Let's Encrypt; todo lo demas se redirige a HTTPS
server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 5m;

    # Encabezados de seguridad
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # HSTS solo en el servidor (se monta desde docker-compose.servidor.yml).
    # En local romperia http://localhost:5005: el navegador aplica HSTS por host, no por puerto.
    include /etc/nginx/snippets/*.conf;

    location / {
        proxy_pass http://app:5000;
        # $http_host conserva el puerto: Flask-WTF compara el Referer con el Host en HTTPS (CSRF)
        proxy_set_header Host              $http_host;
        # Se sobrescribe (no se concatena) lo que mande el cliente: la IP no se puede falsificar por aca
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
